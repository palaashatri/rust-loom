# ---------------------------------------------------------------------------
# Component contracts. Apps compose these roles; they do not restyle them.
# ---------------------------------------------------------------------------
[component.button]
height = 28
min-width = 28
radius = 6
icon = 16
label-size = 13
label-weight = 500
padding-x = 10
never-truncate-label = true

[component.icon-button]
width = 28
height = 28
icon = 16
radius = 6
tooltip-required = true

# Icon-over-label toolbar controls use a taller slot so the icon and 10px
# caption have independent breathing room. Their labels may elide when the
# item reaches its intrinsic minimum; the regular horizontal action contract
# below still requires labels to remain fully visible.
[component.labeled-toolbar-item]
min-height = 48
max-height = 52
icon = 18
label-size = 10
padding-y = 4
allow-label-elision = true

[component.title-chrome]
height = 40
title-is-user-content = true
app-name-is-secondary = true

[component.icon-only-toolbar-item]
width = 28
height = 28
icon = 16
tooltip-required = true

[component.icon-over-label-toolbar-item]
min-height = 48
max-height = 52
icon = 18
label-size = 10
padding-y = 4
allow-label-elision = true

[component.sheet-tab-strip]
height = 30
tab-min-width = 72
label-size = 11

[component.formula-bar]
height = 32
reference-min-width = 72
input-padding-x = 8

[component.field]
height = 28
radius = 6
label-size = 13
padding-x = 8

[component.segmented]
height = 28
radius = 6
max-segments = 6
label-size = 13

[component.text-field]
height = 28
radius = 6
label-size = 13
padding-x = 8

[component.list-row]
dense-height = 28
default-height = 32
radius = 4
label-size = 13

[component.inspector-section]
header-height = 32
body-padding = 12
label-size = 13
label-weight = 600

[component.menu]
row-height = 28
icon = 16
radius = 10
label-size = 13
shortcut-size = 11

[component.tooltip]
label-size = 11
radius = 4
delay-ms = 400

# ---------------------------------------------------------------------------
# Primitive ownership. The toolkit is the sole geometry/state implementation
# for shared chrome. `components.slint` keeps source compatibility through the
# wrapper/re-export maps below; it must not grow a second implementation.
# ---------------------------------------------------------------------------
[primitive-ownership]
canonical-module = "loom-core/crates/loom-ui/ui/toolkit.slint"
icon-module = "loom-core/crates/loom-ui/ui/icons.slint"
compatibility-module = "loom-core/crates/loom-ui/ui/components.slint"
toolbar = "Toolbar"
toolbar-group = "ToolbarGroup"
toolbar-button = "ToolbarButton"
toolbar-icon-button = "IconOnlyToolbarItem"
toolbar-overflow-button = "Overflow"
panel-header = "PanelHeader"
sidebar = "SidebarSurface"
inspector = "InspectorSurface"
status = "StatusBar"
icon = "Icon"
title-chrome = "TitleChrome"
icon-only-toolbar-item = "IconOnlyToolbarItem"
icon-over-label-toolbar-item = "IconOverLabelToolbarItem"
sheet-tab-strip = "SheetTabStrip"
formula-bar = "FormulaBar"
inspector-section = "InspectorSection"
property-row = "PropertyRow"
field = "Field"
segmented-control = "SegmentedControl"
status-bar = "StatusBar"
overflow = "Overflow"

[primitive-ownership.legacy-wrappers]
ToolButton = "ToolbarButton"
IconButton = "IconOnlyToolbarItem"
WorkspaceToolbar = "Toolbar"
PaneTabs = "TabStrip"
Slider = "RangeSlider"
Switch = "Toggle"

[primitive-ownership.legacy-reexports]
DirectionalLayout = "DirectionalLayout"
Toolbar = "Toolbar"
ToolbarGroup = "ToolbarGroup"
ToolbarSpacer = "ToolbarSpacer"
ToolbarButton = "ToolbarButton"
ToolbarIconButton = "ToolbarIconButton"
AppleToolbarItem = "AppleToolbarItem"
ToolbarOverflowButton = "ToolbarOverflowButton"
OverflowMenuButton = "OverflowMenuButton"
PanelHeader = "PanelHeader"
SidebarSurface = "SidebarSurface"
InspectorSurface = "InspectorSurface"
SearchField = "SearchField"
SegmentedControl = "SegmentedControl"
Toggle = "Toggle"
RangeSlider = "RangeSlider"
TabStrip = "TabStrip"
ToolkitStatusBar = "ToolkitStatusBar"
TitleChrome = "TitleChrome"
IconOnlyToolbarItem = "IconOnlyToolbarItem"
IconOverLabelToolbarItem = "IconOverLabelToolbarItem"
SheetTabStrip = "SheetTabStrip"
FormulaBar = "FormulaBar"
InspectorSection = "InspectorSection"
PropertyRow = "PropertyRow"
Field = "Field"
StatusBar = "StatusBar"
Overflow = "Overflow"
ContextToolbar = "ContextToolbar"
LabeledToolbar = "LabeledToolbar"

# Compatibility declarations are intentionally one-way: each old spelling
# inherits the canonical owner in toolkit.slint and may not contain geometry or
# state of its own.
[primitive-ownership.compatibility-inherits]
DocumentChrome = "TitleChrome"
ToolbarIconButton = "IconOnlyToolbarItem"
AppleToolbarItem = "IconOverLabelToolbarItem"
ToolbarOverflowButton = "Overflow"
OverflowMenuButton = "Overflow"
ToolkitStatusBar = "StatusBar"
TextField = "Field"
TabStrip = "SheetTabStrip"

# Compact mode must preserve the primary canvas/grid/timeline width. P1
# actions become icon-only and P2 actions move to the one canonical overflow
# command before any primary workspace minimum is violated.
[overflow-policy]
canonical-button = "Overflow"
compatibility-button = "OverflowMenuButton"
icon = "more"
accessible-role = "button"
accessible-description = "Opens the toolbar overflow menu"
keyboard-activation = ["Space", "Enter"]
priority-1-mode = "icon-only"
priority-2-mode = "overflow"
priority-1-breakpoint = 1180
priority-2-breakpoint = 1320
primary-workspace-min-width = 480
preserve-primary-workspace = true

# ---------------------------------------------------------------------------
# Toolbar policy. Priority 0 survives all supported widths; priority 1 may
# become icon-only; priority 2 moves to overflow. Compact icon-only controls
# keep the [component.icon-button] geometry. Icon-over-label controls use the
# [component.labeled-toolbar-item] slot and may elide their caption at the
# intrinsic minimum; regular horizontal action labels remain fully visible.
# ---------------------------------------------------------------------------
[toolbar]
max-groups = 3
group-gap = 12
item-gap = 4
padding-x = 8
priority-1-icon-only-below = 1180
priority-2-overflow-below = 1320
never-scroll = true
never-wrap = true
# Applies to regular horizontal action labels; labeled toolbar captions use
# component.labeled-toolbar-item.allow-label-elision instead.
never-truncate-actions = true
allow-labeled-item-elision = true
all-items-have-menu-command = true
show-app-name = false
show-neutral-local-state = false

# ---------------------------------------------------------------------------
# Text truncation policy. The action/control defaults apply to regular
# horizontal controls; the labeled toolbar item is the explicit caption
# exception documented above.
# ---------------------------------------------------------------------------
[truncation]
allow-user-content = true
allow-document-title = true
allow-file-name = true
allow-track-name = true
allow-layer-name = true
allow-action-label = false
allow-control-label = false
allow-labeled-toolbar-label = true
allow-section-title = false
allow-status-severity = false
tooltip-required-when-ellipsized = true

# ---------------------------------------------------------------------------
# Shell contracts per application. `primary-share-min` means the central work
# surface receives at least this fraction of available width after mandatory
# chrome at the reference viewport.
# ---------------------------------------------------------------------------
[app.writer]
min-window = [900, 680]
primary-share-min = 0.68
left-sidebar-default = 0
right-inspector-default = 0
persistent-chrome = ["title", "context-toolbar", "status"]
forbidden-persistent-overlays = ["mode-chip", "local-state-pill"]

[app.sheets]
min-window = [900, 680]
primary-share-min = 0.78
left-sidebar-default = 0
right-inspector-default = 0
persistent-chrome = ["title", "formula-bar", "sheet-tabs", "status"]
grid-must-fill-viewport = true

[app.present]
min-window = [1024, 720]
primary-share-min = 0.50
left-sidebar-default = 220
right-inspector-default = 280
persistent-chrome = ["title", "context-toolbar", "status"]

[app.photo]
min-window = [1024, 720]
primary-share-min = 0.52
left-sidebar-default = 240
right-inspector-default = 280
persistent-chrome = ["title", "context-toolbar", "status"]

[app.motion]
min-window = [1100, 720]
primary-share-min = 0.46
left-sidebar-default = 240
right-inspector-default = 280
persistent-chrome = ["title", "context-toolbar", "timeline", "status"]

[app.video]
min-window = [1100, 720]
primary-share-min = 0.46
left-sidebar-default = 240
right-inspector-default = 280
persistent-chrome = ["title", "context-toolbar", "timeline", "status"]

[app.studio]
min-window = [1100, 720]
primary-share-min = 0.60
left-sidebar-default = 180
right-inspector-default = 0
persistent-chrome = ["title", "transport", "timeline", "status"]

[app.encode]
min-window = [960, 680]
primary-share-min = 0.55
left-sidebar-default = 280
right-inspector-default = 300
persistent-chrome = ["title", "queue-toolbar", "status"]

# ---------------------------------------------------------------------------
# Forbidden visual/interaction patterns. The source audit treats these as
# release failures once an app is migrated to the toolkit contract.
# ---------------------------------------------------------------------------
[forbidden]
app-local-hardcoded-colors = true
app-local-control-radii = true
app-local-control-heights = true
app-local-toolbar-shells = true
persistent-canvas-status-overlays = true
# Standard horizontal button/control labels may not ellipsize. The
# icon-over-label toolbar caption is governed by its dedicated component
# contract and is intentionally exempt.
button-label-ellipsis = true
control-label-ellipsis = true
labeled-toolbar-label-ellipsis = false
nested-panel-scrollbars = true
scrolling-toolbar = true
wrapped-toolbar = true
rounded-card-for-every-section = true
app-logo-tile-in-document-chrome = true
neutral-status-pill-in-titlebar = true
fake-page-shadow-rectangle = true
emoji-as-icon = true
color-only-state = true

# ---------------------------------------------------------------------------
# Acceptance rule: a component or shell is not 'done' until every required
# state exists, can be driven by keyboard, and has a deterministic approved
# capture. Approval is external metadata, not 'whatever image is current'.
# ---------------------------------------------------------------------------
[acceptance]
interactive-states = ["default", "hover", "pressed", "keyboard-focus", "disabled"]
selection-states = ["unselected", "selected"]
error-states = ["valid", "invalid"]
require-keyboard-path = true
require-accessible-name = true
require-approved-baseline = true
require-zero-known-layout-defects = true
require-realistic-content-fixture = true
require-empty-state-fixture = true
require-error-state-fixture = true
