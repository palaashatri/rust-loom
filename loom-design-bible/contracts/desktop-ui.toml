# Loom Desktop UI Contract — normative, machine-readable specification
#
# This file is the geometry/interaction authority for shared Loom UI.
# It deliberately contains values a non-visual coding agent can obey and CI can
# validate. Human-approved screenshots remain evidence, never the source of
# geometry truth. Application code may not silently redefine these values.

format-version = "1.0.0"

[meta]
name = "loom-desktop-ui-contract"
owner = "loom-ui"
platform-model = "desktop-pointer-keyboard"
reference-principles = [
  "content-first",
  "clear-hierarchy",
  "direct-manipulation",
  "progressive-disclosure",
  "predictable-placement",
  "accessible-by-default",
  "no-decorative-chrome"
]

# ---------------------------------------------------------------------------
# Validation viewport matrix. All sizes are logical pixels.
# ---------------------------------------------------------------------------
[validation]
reference-viewport = [1280, 800]
required-viewports = [[1024, 720], [1280, 800], [1440, 900], [1920, 1200]]
required-text-scales = [1.0, 1.25, 1.5]
accessibility-text-scale = 2.0
required-directions = ["ltr", "rtl"]
required-themes = ["light", "dark", "high-contrast"]
max-unintentional-overlap-px = 0
max-control-label-clipping-px = 0
# Regular horizontal action labels must remain intact; icon-over-label
# captions use the dedicated labeled-toolbar-item elision rule below.
max-action-label-truncation = 0
max-toolbar-lines = 1
max-toolbar-groups = 3
baseline-diff-mean = 0.012
baseline-diff-pixel-ratio = 0.035

# One owner for responsive toolbar decisions. The probes are intentionally
# adjacent to each boundary so a host cannot accidentally treat a transition
# as a fuzzy range or move it to an app-local magic number.
# Thresholds and transition probes are base-scale logical widths. Evaluate
# transitions against viewport width / max(text scale, 1.0); render each probe
# at its base width * max(text scale, 1.0) to preserve its boundary semantics.
[responsive]
priority-1-icon-only-below = 1180
priority-2-overflow-below = 1320
transition-probes = [1179, 1180, 1279, 1280, 1319, 1320]
text-scale-probes = [1.0, 1.25, 1.5, 2.0]
direction-probes = ["ltr", "rtl"]

# Geometry is validated independently of screenshot hashes. The audit builds
# a deterministic shell manifest for each responsive probe and rejects
# overlap, clipping, wrapped toolbars, and starvation of the primary surface.
[geometry-manifest]
version = "1.0.0"
primary-surface-min-width = 480
primary-surface-min-height = 320
title-height = 40
context-toolbar-height = 40
labeled-toolbar-min-height = 48
labeled-toolbar-max-height = 52
status-height = 28
max-overlap-px = 0
max-clipping-px = 0
max-toolbar-lines = 1

# ---------------------------------------------------------------------------
# Spacing and dimensions.
# ---------------------------------------------------------------------------
[grid]
spacing = [2, 4, 6, 8, 12, 16, 20, 24, 32, 40, 48, 64]
hairline = 1

[type]
ui = 13
caption = 11
small = 12
body = 14
title = 13
section = 13
subtitle = 16
heading = 20
large-heading = 24
weight-regular = 400
weight-medium = 500
weight-semibold = 600
weight-bold = 700
line-height-ui = 18
line-height-caption = 15
line-height-body = 20
line-height-title = 18
numeric-figures = "tabular"

[controls]
standard-height = 28
compact-height = 24
prominent-height = 32
minimum-pointer-target = 28
minimum-exception-target = 20
icon-standard = 16
icon-small = 14
icon-large = 20
button-horizontal-padding = 10
field-horizontal-padding = 8
control-gap = 6
label-gap = 6
focus-ring = 2
focus-offset = 2
border = 1
radius = 6
small-radius = 4
popover-radius = 10

[chrome]
title-height = 40
toolbar-height = 40
context-toolbar-height = 40
labeled-toolbar-min-height = 48
labeled-toolbar-max-height = 52
status-height = 28
panel-header-height = 32
sheet-tab-height = 30
formula-bar-height = 32
left-tool-rail-width = 40
separator = 1

[panels]
sidebar-default = 240
sidebar-min = 200
sidebar-max = 360
inspector-default = 280
inspector-min = 240
inspector-max = 360
panel-padding = 12
section-gap = 16
property-row-min-height = 28
property-label-width-min = 84
property-label-width-max = 112
resize-hit-target = 6

[canvas]
minimum-visible-width = 480
minimum-visible-height = 320
fit-margin = 24
object-handle-visible = 8
object-handle-hit-target = 20
selection-outline = 1
snap-distance = 6
guide-width = 1

[timeline]
minimum-height = 220
track-header-width = 180
ruler-height = 24
track-height-default = 44
track-height-compact = 32
playhead-width = 1
clip-radius = 4
trim-handle-visible = 4
trim-handle-hit-target = 12

[motion]
hover-ms = 0
press-ms = 0
micro-ms = 120
standard-ms = 180
panel-ms = 220
maximum-routine-ms = 250
reduced-motion-ms = 0

