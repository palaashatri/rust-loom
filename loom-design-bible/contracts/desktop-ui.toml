# ---------------------------------------------------------------------------
# Component contracts. Apps compose these roles; they do not restyle them.
# ---------------------------------------------------------------------------
[component.button]
height = 28
min-width = 28
radius = 6
icon = 16
label-size = 13
label-weight = 500
padding-x = 10
never-truncate-label = true

[component.icon-button]
width = 28
height = 28
icon = 16
radius = 6
tooltip-required = true

[component.segmented]
height = 28
radius = 6
max-segments = 6
label-size = 13

[component.text-field]
height = 28
radius = 6
label-size = 13
padding-x = 8

[component.list-row]
dense-height = 28
default-height = 32
radius = 4
label-size = 13

[component.inspector-section]
header-height = 32
body-padding = 12
label-size = 13
label-weight = 600

[component.menu]
row-height = 28
icon = 16
radius = 10
label-size = 13
shortcut-size = 11

[component.tooltip]
label-size = 11
radius = 4
delay-ms = 400

# ---------------------------------------------------------------------------
# Toolbar policy. Priority 0 survives all supported widths; priority 1 may
# become icon-only; priority 2 moves to overflow. Controls never shrink below
# intrinsic label width and action labels never ellipsize.
# ---------------------------------------------------------------------------
[toolbar]
max-groups = 3
group-gap = 12
item-gap = 4
padding-x = 8
priority-1-icon-only-below = 1180
priority-2-overflow-below = 1320
never-scroll = true
never-wrap = true
never-truncate-actions = true
all-items-have-menu-command = true
show-app-name = false
show-neutral-local-state = false

# ---------------------------------------------------------------------------
# Text truncation policy.
# ---------------------------------------------------------------------------
[truncation]
allow-user-content = true
allow-document-title = true
allow-file-name = true
allow-track-name = true
allow-layer-name = true
allow-action-label = false
allow-control-label = false
allow-section-title = false
allow-status-severity = false
tooltip-required-when-ellipsized = true

# ---------------------------------------------------------------------------
# Shell contracts per application. `primary-share-min` means the central work
# surface receives at least this fraction of available width after mandatory
# chrome at the reference viewport.
# ---------------------------------------------------------------------------
[app.writer]
min-window = [900, 680]
primary-share-min = 0.68
left-sidebar-default = 0
right-inspector-default = 0
persistent-chrome = ["title", "context-toolbar", "status"]
forbidden-persistent-overlays = ["mode-chip", "local-state-pill"]

[app.sheets]
min-window = [900, 680]
primary-share-min = 0.78
left-sidebar-default = 0
right-inspector-default = 0
persistent-chrome = ["title", "formula-bar", "sheet-tabs", "status"]
grid-must-fill-viewport = true

[app.present]
min-window = [1024, 720]
primary-share-min = 0.50
left-sidebar-default = 220
right-inspector-default = 280
persistent-chrome = ["title", "context-toolbar", "status"]

[app.photo]
min-window = [1024, 720]
primary-share-min = 0.52
left-sidebar-default = 240
right-inspector-default = 280
persistent-chrome = ["title", "context-toolbar", "status"]

[app.motion]
min-window = [1100, 720]
primary-share-min = 0.46
left-sidebar-default = 240
right-inspector-default = 280
persistent-chrome = ["title", "context-toolbar", "timeline", "status"]

[app.video]
min-window = [1100, 720]
primary-share-min = 0.46
left-sidebar-default = 240
right-inspector-default = 280
persistent-chrome = ["title", "context-toolbar", "timeline", "status"]

[app.studio]
min-window = [1100, 720]
primary-share-min = 0.60
left-sidebar-default = 180
right-inspector-default = 0
persistent-chrome = ["title", "transport", "timeline", "status"]

[app.encode]
min-window = [960, 680]
primary-share-min = 0.55
left-sidebar-default = 280
right-inspector-default = 300
persistent-chrome = ["title", "queue-toolbar", "status"]

# ---------------------------------------------------------------------------
# Forbidden visual/interaction patterns. The source audit treats these as
# release failures once an app is migrated to the toolkit contract.
# ---------------------------------------------------------------------------
[forbidden]
app-local-hardcoded-colors = true
app-local-control-radii = true
app-local-control-heights = true
app-local-toolbar-shells = true
persistent-canvas-status-overlays = true
button-label-ellipsis = true
control-label-ellipsis = true
nested-panel-scrollbars = true
scrolling-toolbar = true
wrapped-toolbar = true
rounded-card-for-every-section = true
app-logo-tile-in-document-chrome = true
neutral-status-pill-in-titlebar = true
fake-page-shadow-rectangle = true
emoji-as-icon = true
color-only-state = true

# ---------------------------------------------------------------------------
# Acceptance rule: a component or shell is not 'done' until every required
# state exists, can be driven by keyboard, and has a deterministic approved
# capture. Approval is external metadata, not 'whatever image is current'.
# ---------------------------------------------------------------------------
[acceptance]
interactive-states = ["default", "hover", "pressed", "keyboard-focus", "disabled"]
selection-states = ["unselected", "selected"]
error-states = ["valid", "invalid"]
require-keyboard-path = true
require-accessible-name = true
require-approved-baseline = true
require-zero-known-layout-defects = true
require-realistic-content-fixture = true
require-empty-state-fixture = true
require-error-state-fixture = true
