# Loom Design Tokens — canonical primitive/semantic token source
#
# `contracts/desktop-ui.toml` defines component geometry, shell composition,
# responsive behavior, forbidden patterns, and acceptance policy. This file
# defines the values consumed by themes/components. Runtime theme values must
# match this file exactly; CI must reject drift.

format-version = "2.0.0"

[meta]
name = "loom-design-tokens"
version = "2.0.0"
owner = "loom-ui"
geometry-contract = "../contracts/desktop-ui.toml"

# ---------------------------------------------------------------------------
# Palette. Neutral chrome keeps visual weight on user content; terracotta is
# reserved for focus, selection, primary actions, and meaningful emphasis.
# ---------------------------------------------------------------------------
[palette.light]
canvas = "#F2F2F4"
canvas-alt = "#EAEAEC"
surface = "#F7F7F8"
surface-raised = "#FFFFFF"
surface-sunken = "#EDEDEF"
chrome = "#F6F6F7"
panel = "#F4F4F5"
overlay = "#FFFFFFF2"
ink = "#1D1D1F"
ink-secondary = "#6E6E73"
ink-disabled = "#A1A1A6"
accent = "#B4552D"
accent-hover = "#C9643A"
accent-pressed = "#994724"
accent-ink = "#FFFFFF"
success = "#347A50"
warning = "#966019"
danger = "#A43424"
info = "#356D9A"
border = "#D1D1D6"
border-strong = "#B8B8BD"
focus = "#B4552D"
selection = "#B4552D"
selection-soft = "#F1DDD4"
danger-surface = "#F6DEDA"
shadow = "#0000001F"
scrim = "#00000066"
grid-major = "#C7C7CC"
grid-minor = "#E1E1E4"
paper = "#FFFFFF"
paper-ink = "#1D1D1F"
paper-muted = "#6E6E73"
paper-line = "#D1D1D6"
media-stage = "#0B0B0C"
content-accent = "#B4552D"
content-accent-soft = "#F1DDD4"
content-cool = "#3E6680"
content-cool-soft = "#E5EDF2"
meter-good = "#4FA96D"
meter-warn = "#D49A3F"

[palette.dark]
canvas = "#1C1C1E"
canvas-alt = "#18181A"
surface = "#242426"
surface-raised = "#2C2C2E"
surface-sunken = "#151517"
chrome = "#242426"
panel = "#202022"
overlay = "#2C2C2EF2"
ink = "#F5F5F7"
ink-secondary = "#AEAEB2"
ink-disabled = "#6C6C70"
accent = "#D97A4A"
accent-hover = "#E88B5E"
accent-pressed = "#BE653B"
accent-ink = "#1C1C1E"
success = "#66BB84"
warning = "#DFA553"
danger = "#E27065"
info = "#78A9D2"
border = "#3A3A3C"
border-strong = "#545458"
focus = "#E88B5E"
selection = "#D97A4A"
selection-soft = "#3D2B22"
danger-surface = "#3D2322"
shadow = "#00000080"
scrim = "#00000099"
grid-major = "#48484A"
grid-minor = "#303033"
paper = "#F8F8FA"
paper-ink = "#1D1D1F"
paper-muted = "#6E6E73"
paper-line = "#D1D1D6"
media-stage = "#070708"
content-accent = "#D97A4A"
content-accent-soft = "#3D2B22"
content-cool = "#6F9AB4"
content-cool-soft = "#22313A"
meter-good = "#58B478"
meter-warn = "#E0A24B"

[palette.high-contrast]
canvas = "#000000"
canvas-alt = "#000000"
surface = "#000000"
surface-raised = "#161616"
surface-sunken = "#000000"
chrome = "#000000"
panel = "#000000"
overlay = "#000000F2"
ink = "#FFFFFF"
ink-secondary = "#FFFFFF"
ink-disabled = "#C8C8C8"
accent = "#FFD84D"
accent-hover = "#FFE681"
accent-pressed = "#E7BD25"
accent-ink = "#000000"
success = "#80FF80"
warning = "#FFBD52"
danger = "#FF7164"
info = "#80CCFF"
border = "#FFFFFF"
border-strong = "#FFFFFF"
focus = "#FFD84D"
selection = "#FFD84D"
selection-soft = "#3A3200"
danger-surface = "#3D0D09"
shadow = "#000000"
scrim = "#000000CC"
grid-major = "#FFFFFF"
grid-minor = "#777777"
paper = "#FFFFFF"
paper-ink = "#000000"
paper-muted = "#222222"
paper-line = "#000000"
media-stage = "#000000"
content-accent = "#FFD84D"
content-accent-soft = "#FFFFFF"
content-cool = "#003CFF"
content-cool-soft = "#FFFFFF"
