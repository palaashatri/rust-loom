# Loom Design Tokens — canonical primitive/semantic token source
#
# `contracts/desktop-ui.toml` defines component geometry, shell composition,
# responsive behavior, forbidden patterns, and acceptance policy. This file
# defines the values consumed by themes/components. Runtime theme values must
# match this file exactly; CI must reject drift.

format-version = "2.0.0"

[meta]
name = "loom-design-tokens"
version = "2.0.0"
owner = "loom-ui"
geometry-contract = "../contracts/desktop-ui.toml"

# ---------------------------------------------------------------------------
# Palette. Neutral chrome keeps visual weight on user content; terracotta is
# reserved for focus, selection, primary actions, and meaningful emphasis.
# ---------------------------------------------------------------------------
[palette.light]
canvas = "#F4F4F6"
canvas-alt = "#EAEAEF"
surface = "#FFFFFF"
surface-raised = "#FFFFFF"
surface-sunken = "#EDEDF2"
chrome = "#FFFFFF"
panel = "#F9F9FA"
overlay = "#FFFFFFF8"
ink = "#18181B"
ink-secondary = "#64646E"
ink-disabled = "#5F5F68"
accent = "#D95324"
accent-hover = "#E66333"
accent-pressed = "#B84016"
accent-ink = "#FFFFFF"
success = "#16A34A"
warning = "#D97706"
danger = "#DC2626"
info = "#0284C7"
border = "#E2E2E8"
border-strong = "#C8C8D2"
focus = "#D95324"
selection = "#D95324"
selection-soft = "#FBECE5"
danger-surface = "#FEE2E2"
shadow = "#00000014"
scrim = "#0000004D"
grid-major = "#C8C8D2"
grid-minor = "#E2E2E8"
paper = "#FFFFFF"
paper-ink = "#18181B"
paper-muted = "#71717A"
paper-line = "#E4E4E7"
media-stage = "#0A0A0C"
content-accent = "#D95324"
content-accent-soft = "#FBECE5"
content-cool = "#0284C7"
content-cool-soft = "#E0F2FE"
meter-good = "#16A34A"
meter-warn = "#D97706"

[palette.dark]
canvas = "#121214"
canvas-alt = "#0E0E10"
surface = "#1A1A1E"
surface-raised = "#24242A"
surface-sunken = "#141416"
chrome = "#1A1A1E"
panel = "#161619"
overlay = "#24242AF2"
ink = "#F4F4F6"
ink-secondary = "#9898A0"
ink-disabled = "#8C8C94"
accent = "#E06338"
accent-hover = "#ED754A"
accent-pressed = "#CA5329"
accent-ink = "#FFFFFF"
success = "#22C55E"
warning = "#F59E0B"
danger = "#EF4444"
info = "#38BDF8"
border = "#2A2A30"
border-strong = "#3C3C46"
focus = "#E06338"
selection = "#E06338"
selection-soft = "#341E17"
danger-surface = "#361919"
shadow = "#00000099"
scrim = "#000000B3"
grid-major = "#34343C"
grid-minor = "#222228"
paper = "#FFFFFF"
paper-ink = "#1A1A1E"
paper-muted = "#71717A"
paper-line = "#E4E4E7"
media-stage = "#0A0A0C"
content-accent = "#E06338"
content-accent-soft = "#341E17"
content-cool = "#38BDF8"
content-cool-soft = "#122B38"
meter-good = "#22C55E"
meter-warn = "#F59E0B"

[palette.high-contrast]
canvas = "#000000"
canvas-alt = "#000000"
surface = "#000000"
surface-raised = "#161616"
surface-sunken = "#000000"
chrome = "#000000"
panel = "#000000"
overlay = "#000000F2"
ink = "#FFFFFF"
ink-secondary = "#FFFFFF"
ink-disabled = "#C8C8C8"
accent = "#FFD84D"
accent-hover = "#FFE681"
accent-pressed = "#E7BD25"
accent-ink = "#000000"
success = "#80FF80"
warning = "#FFBD52"
danger = "#FF7164"
info = "#80CCFF"
border = "#FFFFFF"
border-strong = "#FFFFFF"
focus = "#FFD84D"
selection = "#FFD84D"
selection-soft = "#3A3200"
danger-surface = "#3D0D09"
shadow = "#000000"
scrim = "#000000CC"
grid-major = "#FFFFFF"
grid-minor = "#777777"
paper = "#FFFFFF"
paper-ink = "#000000"
paper-muted = "#222222"
paper-line = "#000000"
media-stage = "#000000"
content-accent = "#FFD84D"
content-accent-soft = "#FFFFFF"
content-cool = "#003CFF"
content-cool-soft = "#FFFFFF"
