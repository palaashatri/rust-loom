[workspace]
resolver = "2"
members = [
    "crates/loom-vision-core",
    "crates/loom-vision-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Loom Vision contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rqrr = { version = "0.10", default-features = false }
image = "0.25"
qrcode = "0.14"
tempfile = "3"
