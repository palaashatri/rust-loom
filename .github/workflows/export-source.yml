name: Export Loom source

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.head_ref == 'chatgpt/loom-ui-functional-audit-2' || github.ref_name == 'chatgpt/loom-ui-functional-audit-2' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Export complete working tree
        uses: actions/upload-artifact@v4
        with:
          name: loom-source-${{ github.sha }}
          include-hidden-files: true
          retention-days: 3
          path: |
            .
            !.git
            !**/target
            !loom-bootstrap/.work
