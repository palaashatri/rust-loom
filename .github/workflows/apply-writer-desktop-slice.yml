              "editor shortcuts",
          )
          ui.write_text(text)

          main = Path("loom-writer/crates/loom-writer-app/src/main.rs")
          text = main.read_text()
          text = replace_once(text, "use std::path::Path;", "use std::path::{Path, PathBuf};", "path import")
          text = replace_once(
              text,
