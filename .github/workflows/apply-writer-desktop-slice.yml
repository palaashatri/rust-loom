name: Apply Writer native desktop slice

on:
  push:
    branches:
      - chatgpt/loom-ui-functional-audit-2
    paths:
      - .github/workflows/apply-writer-desktop-slice.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Apply native desktop integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          cargo = Path("loom-writer/crates/loom-writer-app/Cargo.toml")
          text = cargo.read_text()
          text = replace_once(
              text,
              'loom-writer-core = { path = "../loom-writer-core" }\n',
              'loom-writer-core = { path = "../loom-writer-core" }\nloom-desktop = { path = "../../../loom-core/crates/loom-desktop" }\n',
              "writer desktop dependency",
          )
          cargo.write_text(text)

          ui = Path("loom-writer/crates/loom-writer-app/ui/app.slint")
          text = ui.read_text()
          text = replace_once(
              text,
              "    callback save-doc;\n    callback export-pdf;",
              "    callback save-doc;\n    callback save-as-doc;\n    callback export-pdf;",
              "save-as callback",
          )
          text = replace_once(
              text,
              '            context: "Open document package";',
              '            context: "Local document package";',
              "writer header context",
          )
          text = replace_once(
              text,
              '            ToolButton { icon: "save"; text: "Save"; clicked => { root.save-doc(); } }\n',
              '            ToolButton { icon: "save"; text: "Save"; clicked => { root.save-doc(); } }\n            ToolButton { icon: "save"; text: "Save As"; clicked => { root.save-as-doc(); } }\n',
              "save-as toolbar",
          )
          text = replace_once(
              text,
              '''            if ((event.modifiers.control || event.modifiers.meta) && (event.text == Key.K || event.text == "k")) {
                root.open-palette();
                return accept;
            }
            return reject;''',
              '''            if (event.modifiers.control || event.modifiers.meta) {
                if (event.text == Key.K || event.text == "k") {
                    root.open-palette();
                    return accept;
                }
                if (event.text == "n" || event.text == "N") {
                    root.new-doc();
                    return accept;
                }
                if (event.text == "o" || event.text == "O") {
                    root.open-doc();
                    return accept;
                }
                if (event.text == "s" || event.text == "S") {
                    if (event.modifiers.shift) { root.save-as-doc(); } else { root.save-doc(); }
                    return accept;
                }
                if (event.text == "e" || event.text == "E") {
                    root.export-pdf();
                    return accept;
                }
            }
            return reject;''',
              "window shortcuts",
          )
          text = replace_once(
              text,
              '''                                } else if (event.modifiers.control && (event.text == "y" || event.text == "Y")) {
                                    root.redo();
                                    accept
                                }
                                reject''',
              '''                                } else if ((event.modifiers.control || event.modifiers.meta) && (event.text == "y" || event.text == "Y")) {
                                    root.redo();
                                    accept
                                } else if ((event.modifiers.control || event.modifiers.meta) && (event.text == "s" || event.text == "S")) {
                                    if (event.modifiers.shift) { root.save-as-doc(); } else { root.save-doc(); }
                                    accept
                                } else if ((event.modifiers.control || event.modifiers.meta) && (event.text == "o" || event.text == "O")) {
                                    root.open-doc();
                                    accept
                                } else if ((event.modifiers.control || event.modifiers.meta) && (event.text == "e" || event.text == "E")) {
