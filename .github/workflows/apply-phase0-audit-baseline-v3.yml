name: Apply Phase 0 audit and native baseline fixes v3

on:
  push:
    branches:
      - chatgpt/loom-ui-functional-audit-2
    paths:
      - .github/workflows/apply-phase0-audit-baseline-v3.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUST_MIN_STACK: 33554432
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply Phase 0 migration
        run: python3 loom-bootstrap/scripts/apply-phase0-audit-baseline.py
      - name: Audit truth and contracts
        run: |
          python3 loom-bootstrap/scripts/audit-contracts.py
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py --json /tmp/loom-readiness.json
      - name: Format all workspaces
        run: bash loom-bootstrap/scripts/fmt-all.sh
      - name: Strict Clippy across all workspaces
        run: bash loom-bootstrap/scripts/clippy-all.sh
      - name: Test all workspaces
        run: bash loom-bootstrap/scripts/test-all.sh
      - name: Release-build all workspaces
        run: bash loom-bootstrap/scripts/build-all.sh --release
      - name: Prove repaired Sheets palette journey
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          loom-sheets/target/release/loom-sheets --journey "$out" --theme dark --size 1280x800
          python3 - "$out/sheets.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          assert report['passed'] is True, report
          assert report['query'] == 'save', report
          PY
      - name: Commit validated Phase 0 tranche
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-phase0-audit-baseline.yml
          rm -f .github/workflows/apply-phase0-audit-baseline-v2.yml
          rm -f .github/workflows/apply-phase0-audit-baseline-v3.yml
          rm -f loom-bootstrap/scripts/apply-phase0-audit-baseline.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(audit): restore truthful Phase 0 native baseline"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
      - name: Dispatch four-platform native matrix
        run: gh workflow run cross-platform.yml --ref chatgpt/loom-ui-functional-audit-2
