name: Apply Sheets native desktop slice

on:
  push:
    branches:
      - chatgpt/loom-ui-functional-audit-2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Apply deterministic source migration
        run: |
          python3 -m py_compile loom-bootstrap/scripts/apply-sheets-desktop-slice.py
          python3 loom-bootstrap/scripts/apply-sheets-desktop-slice.py

      - name: Format and validate focused workspace
        run: |
          cargo fmt --manifest-path loom-sheets/Cargo.toml --all
          cargo clippy --manifest-path loom-sheets/Cargo.toml -p loom-sheets-app --all-targets -- -D warnings
          cargo test --manifest-path loom-sheets/Cargo.toml -p loom-sheets-app
          cargo build --manifest-path loom-sheets/Cargo.toml -p loom-sheets-app --release

      - name: Commit validated slice and remove migration machinery
        run: |
          git config user.name "Loom CI Integrator"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-sheets-desktop-slice.yml
          git rm loom-bootstrap/scripts/apply-sheets-desktop-slice.py
          git add loom-sheets
          git commit -m "sheets: use native workbook and CSV dialogs"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
