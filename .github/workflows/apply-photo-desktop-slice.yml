name: Apply Photo native desktop slice

on:
  push:
    branches:
      - chatgpt/loom-ui-functional-audit-2
    paths:
      - .github/workflows/apply-photo-desktop-slice.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            loom-core
            loom-photo

      - name: Verify and apply deterministic Photo migration
        shell: bash
        run: |
          set -euxo pipefail
          root=loom-bootstrap/scripts/photo-migration-payload
          parts=(
            part-00 part-01 part-02 part-03 part-04
            part-05 part-06 part-07 part-08
          )
          hashes=(
            ac8178f868c37a87ccf1efac2dcb71a616473503e9f6633100e5c2992fc6833e
            82d32b89d7de6653b8dc4784f797191cf6af6e76e5632318a63ac69996a99edc
            271b8c0c62aeea608884c60e2faccec204a55b02e6d2526e2ae3319af6279c6f
            7827a6cd9a2d7d43ccfc2bc9cb0c80a543fd5da6b81f2425bfd40870f629bfbf
            f494c22a6af191540e8d0b2d4017520415badeefd49dd8dc479ae587e863a651
            a94d5ef3e950e4766380faea843f4c240f88f4ed5ce0cb5d194aaf377b01bd20
            f48006de39937c7f2b43c619d671477af237735874481679edcfb139e04a36a5
            b3c62acb8c8cdcfd17e7fc4cfe7465dfa1b3128042fe213b48176c7de4963a38
            ed4ac1b5806b216f13184ac7dd9d6ab3cc9b9ce6665f5e935669844811ef3fa6
          )
          : > /tmp/photo-migration.b64
          for index in "${!parts[@]}"; do
            part="$root/${parts[$index]}"
            test "$(wc -c < "$part")" = "760"
            test "$(sha256sum "$part" | cut -d' ' -f1)" = "${hashes[$index]}"
            cat "$part" >> /tmp/photo-migration.b64
          done
          test "$(wc -c < /tmp/photo-migration.b64)" = "6840"
          test "$(sha256sum /tmp/photo-migration.b64 | cut -d' ' -f1)" = "95b518ca65935cebdc40a3737bb567e4f37f37416f00f9395bd2f17f992738bc"
          base64 -d /tmp/photo-migration.b64 | gzip -d > /tmp/apply-photo-desktop-slice.py
          test "$(sha256sum /tmp/apply-photo-desktop-slice.py | cut -d' ' -f1)" = "491cd96a4106511bec5d23dcdad11701d10fce9756c33af4a2d281bc566f6b13"
          python3 /tmp/apply-photo-desktop-slice.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("loom-photo/crates/loom-photo-app/src/main.rs")
          text = path.read_text()
          old = "PathBuf::from(DEFAULT_EXPORT_FILENAME)"
          new = "PathBuf::from(PNG_EXPORT_FILENAME)"
          if text.count(old) != 1:
              raise SystemExit(
                  f"Photo export fallback repair expected 1 match, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format Photo and core
        run: |
          cargo fmt --manifest-path loom-core/Cargo.toml --all
          cargo fmt --manifest-path loom-photo/Cargo.toml --all
          cargo fmt --manifest-path loom-core/Cargo.toml --all --check
          cargo fmt --manifest-path loom-photo/Cargo.toml --all --check

      - name: Clippy Photo with annotations
        shell: bash
        run: |
          set +e
          cargo clippy \
            --manifest-path loom-photo/Cargo.toml \
            --workspace --all-targets --all-features \
            --message-format=json \
            -- -D warnings \
            > /tmp/photo-clippy.json \
            2> /tmp/photo-clippy.stderr
          status=$?
          set -e
          CLIPPY_STATUS="$status" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def escape_command(value: str) -> str:
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          diagnostics = 0
          for raw_line in Path("/tmp/photo-clippy.json").read_text().splitlines():
              try:
                  event = json.loads(raw_line)
              except json.JSONDecodeError:
                  continue
              if event.get("reason") != "compiler-message":
                  continue
              message = event.get("message", {})
              level = message.get("level")
              if level not in {"error", "warning"}:
                  continue
              diagnostics += 1
              rendered = (message.get("rendered") or message.get("message") or "Clippy diagnostic").strip()
              primary = next(
                  (span for span in message.get("spans", []) if span.get("is_primary")),
                  None,
              )
              command = "error" if level == "error" else "warning"
              if primary:
                  print(
                      f"::{command} file={primary.get('file_name','')},"
                      f"line={primary.get('line_start',1)},"
                      f"col={primary.get('column_start',1)}::"
                      f"{escape_command(rendered)}"
                  )
              else:
                  print(f"::{command}::{escape_command(rendered)}")
              print(rendered)

          stderr = Path("/tmp/photo-clippy.stderr").read_text().strip()
          if stderr:
              print(stderr)
          status = int(os.environ["CLIPPY_STATUS"])
          if status != 0 and diagnostics == 0:
              print("::error::Photo Clippy failed without a compiler-message diagnostic")
          PY
          exit "$status"

      - name: Clippy core
        run: cargo clippy --manifest-path loom-core/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Test core
        run: cargo test --manifest-path loom-core/Cargo.toml --workspace

      - name: Test Photo
        run: cargo test --manifest-path loom-photo/Cargo.toml --workspace

      - name: Release build Photo
        run: cargo build --manifest-path loom-photo/Cargo.toml --workspace --release

      - name: Smoke launch Photo
        run: cargo run --manifest-path loom-photo/Cargo.toml --bin loom-photo -- --smoke

      - name: Commit validated Photo slice
        shell: bash
        run: |
          rm -f .github/workflows/apply-photo-desktop-slice.yml
          rm -f loom-bootstrap/scripts/apply-photo-desktop-slice.py.gz.b64
          rm -rf loom-bootstrap/scripts/photo-migration-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(photo): add native project, import, and export workflows"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
