name: Apply Photo native desktop slice

on:
  push:
    branches:
      - chatgpt/loom-ui-functional-audit-2
    paths:
      - .github/workflows/apply-photo-desktop-slice.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            loom-core
            loom-photo

      - name: Verify and apply deterministic Photo migration
        shell: bash
        run: |
          set -euxo pipefail
          root=loom-bootstrap/scripts/photo-migration-payload
          parts=(
            part-00 part-01 part-02 part-03 part-04
            part-05 part-06 part-07 part-08
          )
          hashes=(
            ac8178f868c37a87ccf1efac2dcb71a616473503e9f6633100e5c2992fc6833e
            82d32b89d7de6653b8dc4784f797191cf6af6e76e5632318a63ac69996a99edc
            271b8c0c62aeea608884c60e2faccec204a55b02e6d2526e2ae3319af6279c6f
            7827a6cd9a2d7d43ccfc2bc9cb0c80a543fd5da6b81f2425bfd40870f629bfbf
            f494c22a6af191540e8d0b2d4017520415badeefd49dd8dc479ae587e863a651
            a94d5ef3e950e4766380faea843f4c240f88f4ed5ce0cb5d194aaf377b01bd20
            f48006de39937c7f2b43c619d671477af237735874481679edcfb139e04a36a5
            b3c62acb8c8cdcfd17e7fc4cfe7465dfa1b3128042fe213b48176c7de4963a38
            ed4ac1b5806b216f13184ac7dd9d6ab3cc9b9ce6665f5e935669844811ef3fa6
          )
          : > /tmp/photo-migration.b64
          for index in "${!parts[@]}"; do
            part="$root/${parts[$index]}"
            test "$(wc -c < "$part")" = "760"
            test "$(sha256sum "$part" | cut -d' ' -f1)" = "${hashes[$index]}"
            cat "$part" >> /tmp/photo-migration.b64
          done
          test "$(wc -c < /tmp/photo-migration.b64)" = "6840"
          test "$(sha256sum /tmp/photo-migration.b64 | cut -d' ' -f1)" = "95b518ca65935cebdc40a3737bb567e4f37f37416f00f9395bd2f17f992738bc"
          base64 -d /tmp/photo-migration.b64 | gzip -d > /tmp/apply-photo-desktop-slice.py
          test "$(sha256sum /tmp/apply-photo-desktop-slice.py | cut -d' ' -f1)" = "491cd96a4106511bec5d23dcdad11701d10fce9756c33af4a2d281bc566f6b13"
          python3 /tmp/apply-photo-desktop-slice.py

      - name: Format and validate Photo
        env:
          CARGO_INCREMENTAL: 0
        run: |
          cargo fmt --manifest-path loom-core/Cargo.toml --all
          cargo fmt --manifest-path loom-photo/Cargo.toml --all
          cargo fmt --manifest-path loom-core/Cargo.toml --all --check
          cargo fmt --manifest-path loom-photo/Cargo.toml --all --check
          cargo clippy --manifest-path loom-core/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path loom-core/Cargo.toml --workspace
          cargo clippy --manifest-path loom-photo/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path loom-photo/Cargo.toml --workspace
          cargo build --manifest-path loom-photo/Cargo.toml --workspace --release
          cargo run --manifest-path loom-photo/Cargo.toml --bin loom-photo -- --smoke

      - name: Commit validated Photo slice
        shell: bash
        run: |
          rm -f .github/workflows/apply-photo-desktop-slice.yml
          rm -f loom-bootstrap/scripts/apply-photo-desktop-slice.py.gz.b64
          rm -rf loom-bootstrap/scripts/photo-migration-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(photo): add native project, import, and export workflows"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
