name: Apply native package validation baseline

on:
  push:
    branches:
      - chatgpt/loom-ui-functional-audit-2
    paths:
      - loom-bootstrap/scripts/apply-native-package-validation.py
      - .github/workflows/apply-native-package-validation.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: loom-serialized-product-writer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUST_MIN_STACK: 33554432
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libglu1-mesa-dev dpkg-dev
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply package validation product changes
        run: python3 loom-bootstrap/scripts/apply-native-package-validation.py
      - name: Reconcile two-stage readiness ordering contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('loom-bootstrap/scripts/audit-contracts.py')
          text = p.read_text(encoding='utf-8')
          old = '''score_step = cross_platform.find("Run suite contracts and strict readiness score")
          package_step = cross_platform.find("Build native validation package")
          if journey_step < 0 or ' --journey ' not in cross_platform:
              errors.append("native workflow must execute every application --journey recorder")
          if journey_step >= 0 and score_step >= 0 and journey_step > score_step:
              errors.append("native workflow scores keyboard evidence before journeys run")
          if score_step >= 0 and package_step >= 0 and score_step > package_step:
              errors.append("native workflow must produce readiness evidence even when packaging fails")'''
          new = '''prepackage_step = cross_platform.find("Record pre-package readiness evidence")
          score_step = cross_platform.find("Run suite contracts and strict readiness score")
          package_step = cross_platform.find("Build native validation package")
          validation_step = cross_platform.find("Validate native package contents")
          if journey_step < 0 or ' --journey ' not in cross_platform:
              errors.append("native workflow must execute every application --journey recorder")
          if journey_step >= 0 and prepackage_step >= 0 and journey_step > prepackage_step:
              errors.append("native workflow records keyboard evidence after pre-package readiness")
          if prepackage_step < 0 or package_step < 0 or prepackage_step > package_step:
              errors.append("native workflow must produce readiness evidence even when packaging fails")
          if score_step < 0 or validation_step < 0 or score_step < validation_step:
              errors.append("final native readiness score must consume independently validated package evidence")'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('native readiness ordering contract drifted')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Audit contracts and Python syntax
        run: |
          python3 -m py_compile \
            loom-bootstrap/packaging/release.py \
            loom-bootstrap/packaging/validate.py \
            loom-bootstrap/scripts/audit-contracts.py \
            loom-bootstrap/scripts/audit-product-readiness.py
          python3 loom-bootstrap/scripts/audit-contracts.py
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py --json /tmp/loom-readiness.json
      - name: Format all workspaces
        run: bash loom-bootstrap/scripts/fmt-all.sh
      - name: Strict Clippy across all workspaces
        run: bash loom-bootstrap/scripts/clippy-all.sh
      - name: Test all workspaces
        run: bash loom-bootstrap/scripts/test-all.sh
      - name: Release-build all workspaces
        run: bash loom-bootstrap/scripts/build-all.sh --release
      - name: Build and independently validate Linux package
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python3 loom-bootstrap/packaging/release.py \
            --root "$GITHUB_WORKSPACE" \
            --output "$out" \
            --platform linux \
            --architecture x86_64 \
            --version 0.1.0 \
            --allow-unsigned
          RUNNER_OS=Linux RUNNER_ARCH=X64 LOOM_ARTIFACT_SOURCE_SHA="$GITHUB_SHA" \
            python3 loom-bootstrap/packaging/validate.py \
              --manifest "$out/release-manifest.json" \
              --platform linux \
              --architecture x86_64 \
              --output "$out/package-validation.json"
          python3 - "$out/package-validation.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          assert report['passed'] is True, report
          assert len(report['assertions']) >= 10, report
          PY
      - name: Commit validated package baseline
        run: |
          set -euo pipefail
          rm -f loom-bootstrap/scripts/apply-native-package-validation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/*'
          git diff --cached --check
          git commit -m "test(packaging): verify native release artifacts"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
      - name: Dispatch exact-head native matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cross-platform.yml --ref chatgpt/loom-ui-functional-audit-2
