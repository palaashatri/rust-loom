name: Native targets, packages, and UI validation

on:
  pull_request:
    paths:
      - 'loom-*/**'
      - 'loom-bootstrap/**'
      - '.ci/**'
      - 'TRUTH.md'
      - '.github/workflows/cross-platform.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loom-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-native-menus:
    if: github.head_ref == 'chatgpt/loom-ui-functional-audit-2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 0
      - name: Apply audited source patch
        run: |
          base64 -d .ci/loom-native-menus.patch.xz.b64 | xz -d > /tmp/loom-native-menus.patch
          git apply --check /tmp/loom-native-menus.patch
          git apply /tmp/loom-native-menus.patch
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('loom-bootstrap/scripts/audit-product-ui.py')
          source = ui.read_text(encoding='utf-8')
          marker = '("StatusBar {", "missing shared StatusBar"),\n'
          replacement = marker + '        ("MenuBar {", "missing native application menu bar"),\n        ("shortcut:", "native application menu has no keyboard shortcuts"),\n'
          if 'missing native application menu bar' not in source:
              if marker not in source:
                  raise SystemExit('product UI menu marker not found')
              source = source.replace(marker, replacement, 1)
          ui.write_text(source, encoding='utf-8')

          readiness = Path('loom-bootstrap/scripts/audit-product-readiness.py')
          source = readiness.read_text(encoding='utf-8')
          old = '''    key_handlers = shared.count("key-pressed(event)")
    ui_point(
        "keyboard and command interaction",
        min(0.75, key_handlers / 10.0),
        f"{key_handlers} shared keyboard handlers; no full keyboard journey recorder",
        "complete keyboard-only journeys and command-palette coverage are required",
    )
'''
          new = '''    key_handlers = shared.count("key-pressed(event)")
    menu_apps = sum(1 for text in uis.values() if contains_all(text, ("MenuBar {", "shortcut:")))
    keyboard_score = min(0.9, min(1.0, key_handlers / 10.0) * 0.55 + (menu_apps / len(APPS)) * 0.35)
    ui_point(
        "keyboard and command interaction",
        keyboard_score,
        f"{key_handlers} shared keyboard handlers and native shortcut menus in {menu_apps}/8 apps",
        "complete keyboard-only journeys and searchable command-palette coverage are required",
    )
'''
          if 'native shortcut menus in' not in source:
              if old not in source:
                  raise SystemExit('readiness keyboard marker not found')
              source = source.replace(old, new, 1)
          old = '''    native_shell = 0.25 if positional_open else 0.0
    native_shell += 0.25 if associations else 0.0
    native_shell += 0.25 if packages else 0.0
'''
          new = '''    native_menus = all(contains_all(text, ("MenuBar {", "shortcut:")) for text in uis.values())
    native_shell = 0.25 if positional_open else 0.0
    native_shell += 0.25 if associations else 0.0
    native_shell += 0.25 if packages else 0.0
    native_shell += 0.15 if native_menus else 0.0
'''
          if 'native_menus = all' not in source:
              if old not in source:
                  raise SystemExit('readiness native shell marker not found')
              source = source.replace(old, new, 1)
              source = source.replace(
                  'f"positional open={positional_open}, associations={associations}, native packages={len(packages)}",',
                  'f"positional open={positional_open}, associations={associations}, native menus={native_menus}, native packages={len(packages)}",',
                  1,
              )
          readiness.write_text(source, encoding='utf-8')
          PY
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py --minimum-ui 6.5 --minimum-functionality 5.5
          bash -n loom-bootstrap/scripts/build-all.sh
          git diff --check
      - name: Commit ordinary source only
        run: |
          git rm .ci/loom-native-menus.patch.xz.b64 .ci/apply-native-menus.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(native): add platform menus and parallel workspace builds'
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2

  native-build:
    name: ${{ matrix.platform }}-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
          - runner: windows-2025
            platform: windows
            architecture: x86_64
          - runner: macos-15
            platform: macos
            architecture: aarch64
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      RUST_MIN_STACK: 33554432
      NATIVE_EVIDENCE: loom-bootstrap/.work/native-${{ matrix.platform }}-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev dpkg-dev
      - name: Install WiX Toolset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "4.*"
          "$HOME\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Select Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Build every application workspace
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C link-arg=/STACK:33554432' || '' }}
          LOOM_BUILD_JOBS: 2
        run: bash loom-bootstrap/scripts/build-all.sh --release
      - name: Run native functional journeys and generate sample projects
        shell: bash
        run: >-
          python3 loom-bootstrap/scripts/native-functional-matrix.py
          --root "$GITHUB_WORKSPACE"
          --output "$NATIVE_EVIDENCE/functional"
          --platform "${{ matrix.platform }}"
      - name: Publish generated samples for positional-open UI validation
        shell: bash
        run: |
          rm -rf loom-bootstrap/.work/generated-samples
          mkdir -p loom-bootstrap/.work/generated-samples
          cp -R "$NATIVE_EVIDENCE/functional/generated-samples/." loom-bootstrap/.work/generated-samples/
      - name: Render compact, reference, and large native UI matrices
        shell: bash
        run: >-
          python3 loom-bootstrap/scripts/native-ui-matrix.py
          --root "$GITHUB_WORKSPACE"
          --output "$NATIVE_EVIDENCE/ui"
          --platform "${{ matrix.platform }}"
          --sizes 1024x720,1440x900,1920x1200
      - name: Build native validation package
        shell: bash
        run: >-
          python3 loom-bootstrap/packaging/release.py
          --root "$GITHUB_WORKSPACE"
          --output "$NATIVE_EVIDENCE/packages"
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --version 0.1.0
          --allow-unsigned
      - name: Run suite contracts and strict readiness score
        shell: bash
        run: |
          python3 loom-bootstrap/scripts/audit-contracts.py
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py \
            --evidence-root "$NATIVE_EVIDENCE" \
            --minimum-ui 6.5 --minimum-functionality 5.5 \
            --json "$NATIVE_EVIDENCE/product-score.json"
      - name: Inventory downloadable native evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['NATIVE_EVIDENCE'])
          files = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              payload = path.read_bytes()
              files.append({
                  'path': str(path.relative_to(root)),
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })
          manifest = {
              'schema_version': 1,
              'platform': '${{ matrix.platform }}',
              'architecture': '${{ matrix.architecture }}',
              'files': files,
          }
          (root / 'artifact-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Upload native package and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-native-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: ${{ env.NATIVE_EVIDENCE }}/
