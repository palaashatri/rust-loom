name: Native targets, packages, and UI validation

on:
  pull_request:
    paths:
      - 'loom-*/**'
      - 'loom-bootstrap/**'
      - 'TRUTH.md'
      - '.github/workflows/cross-platform.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loom-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-writer-test-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/loom-ui-functional-audit-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 0
          persist-credentials: true
      - name: Preserve Writer history fixture for assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('loom-writer/crates/loom-writer-app/src/main.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        history.record(second, third.clone(), HistoryKind::DocumentAction, 200);

        assert_eq!(history.undo_len(), 2);
        assert_eq!(history.undo(), Some(second));
        assert_eq!(history.undo(), Some(first));
        assert_eq!(history.redo(), Some(second));
'''
          new = '''        history.record(
            second.clone(),
            third.clone(),
            HistoryKind::DocumentAction,
            200,
        );

        assert_eq!(history.undo_len(), 2);
        assert_eq!(history.undo(), Some(second.clone()));
        assert_eq!(history.undo(), Some(first));
        assert_eq!(history.redo(), Some(second));
'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one Writer history test block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rustup toolchain install stable --profile minimal --component rustfmt
          (cd loom-writer && cargo +stable fmt --all)
          git config user.name 'Loom Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add loom-writer/crates/loom-writer-app/src/main.rs
          git diff --cached --check
          git commit -m 'test(writer): preserve intermediate history fixture'
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2

  native-build:
    name: ${{ matrix.platform }}-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
          - runner: windows-2025
            platform: windows
            architecture: x86_64
          - runner: macos-15
            platform: macos
            architecture: aarch64
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev dpkg-dev
      - name: Install WiX Toolset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "4.*"
          "$HOME\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Select Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Build every application workspace
        shell: bash
        run: bash loom-bootstrap/scripts/build-all.sh --release
      - name: Render native UI matrix and smoke every app
        shell: bash
        run: >-
          python3 loom-bootstrap/scripts/native-ui-matrix.py
          --root "$GITHUB_WORKSPACE"
          --output "loom-bootstrap/.work/native-${{ matrix.platform }}-${{ matrix.architecture }}/ui"
          --platform "${{ matrix.platform }}"
          --size 1440x900
      - name: Build native validation package
        shell: bash
        run: >-
          python3 loom-bootstrap/packaging/release.py
          --root "$GITHUB_WORKSPACE"
          --output "loom-bootstrap/.work/native-${{ matrix.platform }}-${{ matrix.architecture }}/packages"
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --version 0.1.0
          --allow-unsigned
      - name: Run suite contracts and readiness score
        shell: bash
        run: |
          python3 loom-bootstrap/scripts/audit-contracts.py
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py \
            --minimum-ui 7.0 --minimum-functionality 6.0 \
            --json "loom-bootstrap/.work/native-${{ matrix.platform }}-${{ matrix.architecture }}/product-score.json"
      - name: Upload native package and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-native-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
          path: loom-bootstrap/.work/native-${{ matrix.platform }}-${{ matrix.architecture }}/
