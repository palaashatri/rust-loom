name: Native targets, packages, and UI validation

on:
  pull_request:
    paths:
      - 'loom-*/**'
      - 'loom-bootstrap/**'
      - 'TRUTH.md'
      - '.github/workflows/cross-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: ${{ matrix.platform }}-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
          - runner: windows-2025
            platform: windows
            architecture: x86_64
          - runner: macos-15
            platform: macos
            architecture: aarch64
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      RUST_MIN_STACK: 33554432
      NATIVE_EVIDENCE: loom-bootstrap/.work/native-${{ matrix.platform }}-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev dpkg-dev
      - name: Install WiX Toolset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "4.*"
          "$HOME\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Select Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Build every application workspace
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C link-arg=/STACK:33554432' || '' }}
        run: bash loom-bootstrap/scripts/build-all.sh --release
      - name: Run native functional journeys and generate sample projects
        shell: bash
        run: >-
          python3 loom-bootstrap/scripts/native-functional-matrix.py
          --root "$GITHUB_WORKSPACE"
          --output "$NATIVE_EVIDENCE/functional"
          --platform "${{ matrix.platform }}"
      - name: Publish generated samples for positional-open UI validation
        shell: bash
        run: |
          rm -rf loom-bootstrap/.work/generated-samples
          mkdir -p loom-bootstrap/.work/generated-samples
          cp -R "$NATIVE_EVIDENCE/functional/generated-samples/." loom-bootstrap/.work/generated-samples/
      - name: Render compact, reference, and large native UI matrices
        shell: bash
        run: >-
          python3 loom-bootstrap/scripts/native-ui-matrix.py
          --root "$GITHUB_WORKSPACE"
          --output "$NATIVE_EVIDENCE/ui"
          --platform "${{ matrix.platform }}"
          --sizes 1024x720,1440x900,1920x1200
      - name: Build native validation package
        shell: bash
        run: >-
          python3 loom-bootstrap/packaging/release.py
          --root "$GITHUB_WORKSPACE"
          --output "$NATIVE_EVIDENCE/packages"
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --version 0.1.0
          --allow-unsigned
      - name: Run suite contracts and strict readiness score
        shell: bash
        run: |
          python3 loom-bootstrap/scripts/audit-contracts.py
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py \
            --evidence-root "$NATIVE_EVIDENCE" \
            --minimum-ui 6.5 --minimum-functionality 5.5 \
            --json "$NATIVE_EVIDENCE/product-score.json"
      - name: Inventory downloadable native evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['NATIVE_EVIDENCE'])
          files = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              payload = path.read_bytes()
              files.append({
                  'path': str(path.relative_to(root)),
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })
          manifest = {
              'schema_version': 1,
              'platform': '${{ matrix.platform }}',
              'architecture': '${{ matrix.architecture }}',
              'files': files,
          }
          (root / 'artifact-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Upload native package and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-native-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: ${{ env.NATIVE_EVIDENCE }}/
