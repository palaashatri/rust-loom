name: Loom full native matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-full-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: ${{ matrix.platform }}-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
          - runner: windows-2025
            platform: windows
            architecture: x86_64
          - runner: macos-15
            platform: macos
            architecture: aarch64
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      RUST_MIN_STACK: 33554432
      NATIVE_EVIDENCE: loom-bootstrap/.work/native-${{ matrix.platform }}-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev dpkg-dev
      - name: Install WiX Toolset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "4.*"
          "$HOME\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Select Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Run repository governance gates
        shell: bash
        run: |
          python3 loom-bootstrap/scripts/audit-governance.py
          python3 loom-bootstrap/scripts/audit-code-structure.py
          python3 loom-bootstrap/scripts/audit-assets.py
          python3 loom-bootstrap/scripts/audit-ui-foundation.py
      - name: Build every application workspace
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C link-arg=/STACK:33554432' || '' }}
        run: bash loom-bootstrap/scripts/build-all.sh --release
      - name: Run native functional journeys
        shell: bash
        run: >-
          python3 loom-bootstrap/scripts/native-functional-matrix.py
          --root "$GITHUB_WORKSPACE"
          --output "$NATIVE_EVIDENCE/functional"
          --platform "${{ matrix.platform }}"
      - name: Render native UI evidence
        shell: bash
        run: >-
          python3 loom-bootstrap/scripts/native-ui-matrix.py
          --root "$GITHUB_WORKSPACE"
          --output "$NATIVE_EVIDENCE/ui"
          --platform "${{ matrix.platform }}"
          --sizes 1024x720,1440x900,1920x1200
      - name: Build native validation package
        shell: bash
        run: >-
          python3 loom-bootstrap/packaging/release.py
          --root "$GITHUB_WORKSPACE"
          --output "$NATIVE_EVIDENCE/packages"
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --version 0.1.0
          --allow-unsigned
      - name: Validate native package contents
        shell: bash
        env:
          LOOM_ARTIFACT_SOURCE_SHA: ${{ github.sha }}
          LOOM_ARTIFACT_SOURCE_RUN_ID: ${{ github.run_id }}
        run: >-
          python3 loom-bootstrap/packaging/validate.py
          --manifest "$NATIVE_EVIDENCE/packages/release-manifest.json"
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --output "$NATIVE_EVIDENCE/packages/package-validation.json"
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-native-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.NATIVE_EVIDENCE }}/

  native-baseline:
    name: required-native-baseline
    if: always()
    needs: native-build
    runs-on: ubuntu-24.04
    steps:
      - name: Require every declared native target to pass
        env:
          NATIVE_MATRIX_RESULT: ${{ needs.native-build.result }}
        shell: bash
        run: |
          if [ "$NATIVE_MATRIX_RESULT" != "success" ]; then
            echo "required native matrix did not fully pass: $NATIVE_MATRIX_RESULT" >&2
            exit 1
          fi
