name: Apply Motion native desktop slice

on:
  push:
    branches: [chatgpt/loom-ui-functional-audit-2]
    paths: [.github/workflows/apply-motion-desktop-slice.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact integration head
        shell: bash
        run: |
          set -euxo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin chatgpt/loom-ui-functional-audit-2
          git checkout -B chatgpt/loom-ui-functional-audit-2 FETCH_HEAD
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply verified Motion migration
        shell: bash
        run: |
          set -euxo pipefail
          cat loom-bootstrap/scripts/motion-migration-payload/part-* > /tmp/motion.b64
          test "$(wc -c < /tmp/motion.b64)" = 4932
          test "$(sha256sum /tmp/motion.b64 | cut -d' ' -f1)" = 8f8aad93a44184c88e1f7ba261012521c66112e5af381a8ccf254bc7540058e0
          base64 -d /tmp/motion.b64 | gzip -d > /tmp/motion.py
          test "$(sha256sum /tmp/motion.py | cut -d' ' -f1)" = 75b7d52001988e8fc7024ffe30f115a9ca05c7a949f8e60218b6283d410341fa
          python3 /tmp/motion.py
      - name: Apply complete Motion product invariants
        shell: bash
        run: |
          set -euxo pipefail
          cat loom-bootstrap/scripts/stabilize-motion-v2-payload/part-* > /tmp/stabilize-motion-v2.b64
          test "$(wc -c < /tmp/stabilize-motion-v2.b64)" = 6148
          test "$(sha256sum /tmp/stabilize-motion-v2.b64 | cut -d' ' -f1)" = 1cc6ed43c146e1493e172e19fbed0279187cc25ea19ba3fb923983b72008237e
          base64 -d /tmp/stabilize-motion-v2.b64 | gzip -d > /tmp/stabilize-motion-v2.py
          test "$(wc -c < /tmp/stabilize-motion-v2.py)" = 20060
          test "$(sha256sum /tmp/stabilize-motion-v2.py | cut -d' ' -f1)" = 41bb8a2ba33e4350a8729e6ce45ca62ae1c685e999d28a1ae0626abdb4bf3423
          python3 /tmp/stabilize-motion-v2.py
      - name: Format
        run: |
          cargo fmt --manifest-path loom-core/Cargo.toml --all
          cargo fmt --manifest-path loom-motion/Cargo.toml --all
          cargo fmt --manifest-path loom-core/Cargo.toml --all --check
          cargo fmt --manifest-path loom-motion/Cargo.toml --all --check
      - name: Strict core validation
        run: |
          cargo clippy --manifest-path loom-core/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path loom-core/Cargo.toml --workspace
      - name: Strict Motion validation
        run: |
          cargo clippy --manifest-path loom-motion/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path loom-motion/Cargo.toml --workspace
          cargo build --manifest-path loom-motion/Cargo.toml --workspace --release
      - name: Smoke representative window sizes
        shell: bash
        run: |
          set -euo pipefail
          for size in 920x720 1179x800 1180x800 1440x900; do
            output="$(cargo run --manifest-path loom-motion/Cargo.toml --bin loom-motion -- --smoke --size "$size" 2>&1)"
            printf '%s\n' "$output"
            ! grep -Eqi 'binding[ -]loop' <<<"$output"
          done
      - name: Commit validated Motion slice
        shell: bash
        run: |
          rm -f .github/workflows/apply-motion-desktop-slice.yml loom-bootstrap/scripts/stabilize-motion.py
          rm -rf loom-bootstrap/scripts/motion-migration-payload loom-bootstrap/scripts/stabilize-motion-v2-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(motion): complete native document workflow invariants"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
