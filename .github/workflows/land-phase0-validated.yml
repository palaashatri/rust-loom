name: Land already-validated Phase 0 product tree

on:
  push:
    branches:
      - chatgpt/loom-ui-functional-audit-2
    paths:
      - loom-bootstrap/scripts/apply-phase0-audit-baseline.py

permissions:
  contents: write

concurrency:
  group: loom-phase0-fast-land
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
      - name: Apply validated Phase 0 migration
        run: python3 loom-bootstrap/scripts/apply-phase0-audit-baseline.py
      - name: Preserve whitespace-tolerant keyboard truth audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('loom-bootstrap/scripts/audit-contracts.py')
          text = p.read_text(encoding='utf-8')
          old = 'if "do not prove complete keyboard-only application operation" not in truth:\n    errors.append("TRUTH.md must preserve the keyboard host-hook limitation")'
          new = 'if not re.search(r"do not prove\\s+complete keyboard-only application operation", truth):\n    errors.append("TRUTH.md must preserve the keyboard host-hook limitation")'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('keyboard truth audit target drifted')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Recheck contracts
        run: |
          python3 loom-bootstrap/scripts/audit-contracts.py
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py --json /tmp/loom-readiness.json
      - name: Commit only the already-validated product tree
        run: |
          set -euo pipefail
          rm -f loom-bootstrap/scripts/apply-phase0-audit-baseline.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/*'
          git diff --cached --check
          git commit -m "fix(audit): restore truthful Phase 0 native baseline"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
