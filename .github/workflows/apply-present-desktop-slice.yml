name: Apply Present native desktop slice

on:
  push:
    branches:
      - chatgpt/loom-ui-functional-audit-2
    paths:
      - .github/workflows/apply-present-desktop-slice.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            loom-core
            loom-present

      - name: Repair deterministic migration generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("loom-bootstrap/scripts/apply-present-desktop-slice.py")
          text = path.read_text()
          old = '''fn save_request(state: &GuiState) -> SaveFileRequest {
              let path = state.save_path.borrow();
              let suggested_name = path
                  .as_deref()
                  .and_then(Path::file_name)
                  .map(|name| name.to_string_lossy().into_owned())
                  .unwrap_or_else(|| SAVE_FILENAME.to_string());
              SaveFileRequest {
                  title: "Save Loom Present Deck".into(),
                  initial_directory: initial_directory(path.as_deref()),
                  suggested_name: Some(suggested_name),
                  filters: vec![state.deck_filter.clone()],
              }
          }
          '''
          new = '''fn save_request(state: &GuiState) -> SaveFileRequest {
              let path = state.save_path.borrow().clone();
              let suggested_name = path
                  .as_deref()
                  .and_then(|path| path.file_name())
                  .map(|name| name.to_string_lossy().into_owned())
                  .unwrap_or_else(|| SAVE_FILENAME.to_string());
              SaveFileRequest {
                  title: "Save Loom Present Deck".into(),
                  initial_directory: initial_directory(path.as_deref()),
                  suggested_name: Some(suggested_name),
                  filters: vec![state.deck_filter.clone()],
              }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("save_request generator repair did not match exactly once")
          text = text.replace(old, new, 1)
          text = text.replace(
              'assert_eq!(open.filters[0].extensions, ["loomdeck"]);',
              'assert_eq!(open.filters[0].extensions, vec!["loomdeck".to_string()]);',
          )
          text = text.replace(
              'assert_eq!(export.filters[0].extensions, ["pdf"]);',
              'assert_eq!(export.filters[0].extensions, vec!["pdf".to_string()]);',
          )
          path.write_text(text)
          PY

      - name: Apply deterministic source migration
        run: python3 loom-bootstrap/scripts/apply-present-desktop-slice.py

      - name: Format and validate Present
        run: |
          cargo fmt --manifest-path loom-core/Cargo.toml --all
          cargo fmt --manifest-path loom-present/Cargo.toml --all
          cargo fmt --manifest-path loom-core/Cargo.toml --all --check
          cargo fmt --manifest-path loom-present/Cargo.toml --all --check
          cargo clippy --manifest-path loom-core/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path loom-core/Cargo.toml --workspace
          cargo clippy --manifest-path loom-present/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path loom-present/Cargo.toml --workspace
          cargo build --manifest-path loom-present/Cargo.toml --workspace --release

      - name: Commit validated slice and remove migration machinery
        shell: bash
        run: |
          rm -f loom-bootstrap/scripts/apply-present-desktop-slice.py
          rm -f .github/workflows/apply-present-desktop-slice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(present): add native desktop file workflows"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
