name: Loom downloadable builds

# Builds every Loom application for Linux, Windows, and macOS (Apple silicon and
# Intel) and publishes portable archives: unzip, run, no installer.
#
#   - every push to main refreshes the rolling "nightly" pre-release
#   - a v* tag publishes a versioned release
#   - workflow_dispatch builds the archives as workflow artifacts only
#
# Signed installers (MSI, DMG, .deb) remain the job of the manual "Loom full
# native matrix" workflow; this one exists so anyone can download and try the
# suite today.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-release-${{ github.ref }}
  cancel-in-progress: true

env:
  APPS: "writer sheets present photo motion video studio encode"

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
            archive: tar.gz
            exe: ""
          - runner: windows-2022
            label: windows-x86_64
            archive: zip
            exe: ".exe"
          - runner: macos-15
            label: macos-arm64
            archive: tar.gz
            exe: ""
          - runner: macos-15-intel
            label: macos-x86_64
            archive: tar.gz
            exe: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      # One target directory for all eight workspaces: Slint and the shared
      # crates are compiled once per platform instead of once per app.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-release
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Select Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build every application (release)
        shell: bash
        run: |
          set -euo pipefail
          # Windows: link a 32 MiB stack (Slint's generated UI recurses deeply)
          # and use the GUI subsystem so double-clicking does not open a console.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export RUSTFLAGS="-C link-arg=/STACK:33554432 -C link-arg=/SUBSYSTEM:WINDOWS -C link-arg=/ENTRY:mainCRTStartup"
          fi
          for app in $APPS; do
            echo "::group::build loom-$app"
            cargo build --release --locked \
              --manifest-path "loom-$app/Cargo.toml" -p "loom-$app-app"
            echo "::endgroup::"
          done

      - name: Stage the portable archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="nightly-${GITHUB_SHA::7}"
          fi
          name="loom-${version}-${{ matrix.label }}"
          stage="dist/${name}"
          mkdir -p "${stage}"
          for app in $APPS; do
            src="target-release/release/loom-${app}${{ matrix.exe }}"
            test -f "${src}" || { echo "missing binary ${src}"; exit 1; }
            cp "${src}" "${stage}/"
          done
          cp LICENSE "${stage}/LICENSE"
          cat > "${stage}/README.txt" <<'EOF'
          Loom - portable build
          =====================
          Run any application directly; nothing needs to be installed:
            loom-writer   word processor
            loom-sheets   spreadsheets
            loom-present  presentations
            loom-photo    image editing
            loom-motion   motion graphics
            loom-video    video editing
            loom-studio   audio
            loom-encode   media transcoding (needs FFmpeg on PATH)

          Windows: the build is unsigned, so SmartScreen may say "Windows protected
          your PC". Choose "More info", then "Run anyway".

          macOS: the build is unsigned. After unpacking, remove the quarantine flag:
            xattr -dr com.apple.quarantine .
            chmod +x loom-*
          then run from a terminal or Finder (right-click, Open).

          Linux: needs a desktop session (X11 or Wayland), OpenGL, and fontconfig.
            chmod +x loom-*   # if your archive tool dropped the execute bit
          EOF
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
            echo "ARCHIVE=dist/${name}.zip" >> "$GITHUB_ENV"
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            echo "ARCHIVE=dist/${name}.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -la dist

      - name: Smoke test one binary
        shell: bash
        run: |
          set -euo pipefail
          # Headless render through the real application; proves the binary
          # starts, links, and paints on this OS.
          out="$RUNNER_TEMP/loom-sheets-smoke.png"
          "target-release/release/loom-sheets${{ matrix.exe }}" --screenshot "$out" --size 1280x800 --example
          test -s "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: loom-${{ matrix.label }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum loom-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "${GITHUB_REF_NAME}" assets/* \
              --title "Loom ${GITHUB_REF_NAME}" --generate-notes
          else
            # Rolling pre-release: replace the previous nightly.
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly assets/* \
              --target "${GITHUB_SHA}" --prerelease \
              --title "Loom nightly (${GITHUB_SHA::7})" \
              --notes "Portable, unsigned builds of every Loom app from commit ${GITHUB_SHA}. Unzip and run; see README.txt inside the archive."
          fi
