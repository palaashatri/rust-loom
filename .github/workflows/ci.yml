name: Loom suite CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      VISUAL_QA_SHOT_SECS: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply ChatGPT hardening patch
        run: |
          base64 -d .ci/loom-hardening.patch.gz.b64 | gzip -d | git apply --binary --whitespace=nowarn

      - name: Install Linux build and visual-QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev \
            libwayland-dev libx11-xcb-dev libgl1-mesa-dev libegl1-mesa-dev \
            mesa-vulkan-drivers xvfb fonts-dejavu-core fonts-noto-core \
            zip unzip python3 ca-certificates

      - name: Select pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            loom-core
            loom-writer
            loom-sheets
            loom-present
            loom-photo
            loom-motion
            loom-video
            loom-studio
            loom-encode
            loom-vision
            loom-plugin-sdk

      - name: Check formatting
        run: bash loom-bootstrap/scripts/fmt-all.sh

      - name: Test all workspaces
        run: bash loom-bootstrap/scripts/test-all.sh

      - name: Lint all workspaces
        run: bash loom-bootstrap/scripts/clippy-all.sh

      - name: Build all release binaries
        run: bash loom-bootstrap/scripts/build-all.sh --release

      - name: Run app smoke captures
        run: bash loom-bootstrap/scripts/run-apps.sh

      - name: Capture and compare light/dark UI
        id: visual
        continue-on-error: true
        run: bash loom-bootstrap/scripts/visual-qa-all.sh

      - name: Generate evidence report
        if: always()
        run: bash loom-bootstrap/scripts/generate-status-report.sh

      - name: Package verified source and binaries
        if: success() || steps.visual.outcome == 'failure'
        run: bash loom-bootstrap/scripts/package.sh

      - name: Upload complete package
        if: success() || steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Loom-Complete
          if-no-files-found: error
          retention-days: 14
          path: |
            Loom-Complete.zip
            Loom-Complete.zip.sha256
            Loom-Manifest.json
            VERIFICATION_REPORT.md
            visual-qa-report.md
            loom-bootstrap/.work/screenshots/
            loom-bootstrap/.work/diffs/
            loom-bootstrap/.work/*.log
