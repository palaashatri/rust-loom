name: Loom CI

on:
  pull_request:
  push:
    branches: [main, cline-implementation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-staged-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/loom-ui-functional-audit-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 0
          persist-credentials: true
      - id: staged
        run: |
          if [ -f .ci/fix.py ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Apply and format shared runtime fixes
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/fix.py
          rustup toolchain install stable --profile minimal --component rustfmt
          (cd loom-core && cargo +stable fmt --all)
          (cd loom-plugin-sdk && cargo +stable fmt --all)
          (cd loom-vision && cargo +stable fmt --all)
          rm -rf .ci
          git config user.name "Loom Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: integrate production media and plugin runtimes"
          git push origin "HEAD:chatgpt/loom-ui-functional-audit-2"

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit UI/Rust contracts
        run: python3 loom-bootstrap/scripts/audit-contracts.py

  workspace:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        workspace:
          - loom-core
          - loom-writer
          - loom-sheets
          - loom-present
          - loom-photo
          - loom-motion
          - loom-video
          - loom-studio
          - loom-encode
          - loom-vision
          - loom-plugin-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable with lint and format components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
          shared-key: loom-${{ matrix.workspace }}
      - name: Check formatting
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --all --check
      - name: Lint
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: cargo test --workspace
      - name: Build release
        working-directory: ${{ matrix.workspace }}
        run: cargo build --workspace --release

  visual-smoke:
    needs: [contracts, workspace]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f loom-bootstrap/docker/compose.yaml build visual
      - run: >-
          docker compose -f loom-bootstrap/docker/compose.yaml run --rm visual
          bash -lc "scripts/build-all.sh --release && xvfb-run -a -s '-screen 0 1280x800x24' scripts/visual-smoke-matrix.sh"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-theme-matrix
          if-no-files-found: warn
          retention-days: 14
          path: |
            loom-bootstrap/.work/theme-matrix/
            loom-bootstrap/.work/theme-matrix-report.md
            loom-bootstrap/.work/theme-*.log
