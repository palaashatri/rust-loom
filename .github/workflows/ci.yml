name: Loom CI

on:
  pull_request:
  push:
    branches: [main, cline-implementation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-completion-tranche:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/loom-ui-functional-audit-2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect staged payload
        id: payload
        shell: bash
        run: |
          if [ -f .ci/loom-tranche-1.patch.xz.b64 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reviewed source patch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/loom-tranche-1.patch.xz.b64 | xz -dc > /tmp/loom-tranche.patch
          git apply --check --whitespace=error-all /tmp/loom-tranche.patch
          git apply --binary --whitespace=nowarn /tmp/loom-tranche.patch

      - name: Canonical formatting and dependency locks
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          for workspace in \
            loom-core loom-writer loom-sheets loom-present loom-photo loom-motion \
            loom-video loom-studio loom-encode loom-vision loom-plugin-sdk; do
            (cd "$workspace" && cargo +stable fmt --all)
          done
          (cd loom-photo && cargo +stable generate-lockfile)
          (cd loom-studio && cargo +stable generate-lockfile)

      - name: Commit source changes
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci
          git config user.name "Loom Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: wire real creative workflows and redesign suite UI"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit UI/Rust contracts
        run: python3 loom-bootstrap/scripts/audit-contracts.py

  workspace:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        workspace:
          - loom-core
          - loom-writer
          - loom-sheets
          - loom-present
          - loom-photo
          - loom-motion
          - loom-video
          - loom-studio
          - loom-encode
          - loom-vision
          - loom-plugin-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Select Rust stable with lint and format components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
          shared-key: loom-${{ matrix.workspace }}

      - name: Check formatting
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --all --check

      - name: Lint
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: cargo test --workspace

      - name: Build release
        working-directory: ${{ matrix.workspace }}
        run: cargo build --workspace --release

  visual-smoke:
    needs: [contracts, workspace]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build visual-QA image
        run: docker compose -f loom-bootstrap/docker/compose.yaml build visual

      - name: Build applications and capture theme matrix
        run: >-
          docker compose -f loom-bootstrap/docker/compose.yaml run --rm visual
          bash -lc "scripts/build-all.sh --release && xvfb-run -a -s '-screen 0 1280x800x24' scripts/visual-smoke-matrix.sh"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-theme-matrix
          if-no-files-found: warn
          retention-days: 14
          path: |
            loom-bootstrap/.work/theme-matrix/
            loom-bootstrap/.work/theme-matrix-report.md
            loom-bootstrap/.work/theme-*.log
