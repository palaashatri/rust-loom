name: Loom active-phase CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-active-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Governance and serial workflow lock
        run: |
          python3 -m unittest discover -s loom-bootstrap/scripts -p test_audit_governance.py
          python3 loom-bootstrap/scripts/audit-governance.py
      # Every audit runs even if an earlier one failed. A red ratchet used to
      # hide a failing UI-foundation contract behind it for several commits.
      - name: Code structure ratchet
        if: ${{ !cancelled() }}
        run: python3 loom-bootstrap/scripts/audit-code-structure.py
      - name: Commercial asset provenance
        if: ${{ !cancelled() }}
        run: python3 loom-bootstrap/scripts/audit-assets.py
      - name: UI foundation source contract
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s loom-bootstrap/scripts -p test_audit_ui_foundation.py
          python3 loom-bootstrap/scripts/audit-ui-foundation.py

  sheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            loom-sheets -> target
            loom-core -> target
          shared-key: loom-sheets
      - name: Format Sheets workspace
        working-directory: loom-sheets
        run: cargo fmt --all --check
      - name: Clippy Sheets workspace
        working-directory: loom-sheets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Sheets workspace
        working-directory: loom-sheets
        run: cargo test --workspace --locked

  # Writer and Present are active applications too. Their suites run on Linux
  # and Windows so a font- or platform-dependent geometry assertion cannot hide
  # until a user finds it (the Sheets Linux failure did exactly that).
  writer:
    name: Writer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            loom-writer -> target
            loom-core -> target
          shared-key: loom-writer-${{ matrix.os }}
      - name: Format Writer workspace
        working-directory: loom-writer
        run: cargo fmt --all --check
      - name: Clippy Writer workspace
        working-directory: loom-writer
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Writer workspace
        working-directory: loom-writer
        run: cargo test --workspace --locked

  present:
    name: Present (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            loom-present -> target
            loom-core -> target
          shared-key: loom-present-${{ matrix.os }}
      - name: Format Present workspace
        working-directory: loom-present
        run: cargo fmt --all --check
      - name: Clippy Present workspace
        working-directory: loom-present
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Present workspace
        working-directory: loom-present
        run: cargo test --workspace --locked

  sheets-scroll-budget:
    name: Sheets scroll budget (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential pkg-config libasound2-dev libfontconfig1-dev             libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            loom-sheets -> target
            loom-core -> target
          shared-key: loom-sheets-scroll-${{ matrix.os }}
      # Scrolls a 300,000-cell sheet through the real scroll callback and a
      # software render. Fails the build if the callback or a frame exceeds its
      # budget, and prints the measured numbers for the ledger.
      - name: Scroll callback and frame budget
        working-directory: loom-sheets
        env:
          LOOM_FRAME_BENCH: enforce
        run: cargo test --release --locked -p loom-sheets-app --bin loom-sheets frame_bench_tests -- --nocapture

  recovery:
    name: Recovery journal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Test recovery journal and atomic replacement
        run: cargo test --manifest-path loom-core/Cargo.toml -p loom-production --locked

  plugin-host:
    name: Plugin host write boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Test plugin host permissions and secure writes
        run: cargo test --manifest-path loom-plugin-sdk/Cargo.toml -p loom-plugin-host --locked

  encode-output-publish:
    name: Encode output publication (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Test Encode output publication helper
        run: cargo test --manifest-path loom-encode/Cargo.toml -p loom-encode-core --lib output_publish::tests --locked
      - name: Test collision during a controlled encode
        run: cargo test --manifest-path loom-encode/Cargo.toml -p loom-encode-core --test output_publish --locked

  ui-foundation:
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: loom-core
          shared-key: loom-ui-foundation
      - name: Format shared workspace
        working-directory: loom-core
        run: cargo fmt --all --check
      - name: Clippy shared UI
        working-directory: loom-core
        run: cargo clippy -p loom-ui --all-targets -- -D warnings
      - name: Test and render foundation gallery
        working-directory: loom-core
        env:
          LOOM_FOUNDATION_EVIDENCE: ${{ github.workspace }}/loom-bootstrap/.work/foundation-gallery
        run: cargo test -p loom-ui
      - name: Upload reviewable foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-ui-foundation-gallery
          if-no-files-found: error
          retention-days: 14
          path: loom-bootstrap/.work/foundation-gallery/
