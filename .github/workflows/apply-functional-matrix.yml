name: Apply native functional journey matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: (github.head_ref == 'chatgpt/loom-ui-functional-audit-2' || github.ref_name == 'chatgpt/loom-ui-functional-audit-2') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 0
      - name: Apply exact audited patch
        run: |
          base64 -d .ci/loom-functional.patch.xz.b64 | xz -d > /tmp/loom-functional.patch
          git apply --check /tmp/loom-functional.patch
          git apply /tmp/loom-functional.patch
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py --minimum-ui 6.5 --minimum-functionality 5.5
          git diff --check
      - name: Commit ordinary source only
        run: |
          git checkout -- .github/workflows/cross-platform.yml
          git rm .ci/loom-functional.patch.xz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(native): add eight-app functional journey matrix'
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
