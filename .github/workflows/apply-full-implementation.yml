name: Apply full Loom implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'chatgpt/loom-ui-functional-audit-2' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and apply audited implementation
        run: |
          set -euo pipefail
          cat .ci/full-implementation/* | base64 -d | gzip -d > /tmp/loom-full.diff
          git apply --check --binary --whitespace=error-all /tmp/loom-full.diff
          git apply --binary --whitespace=error-all /tmp/loom-full.diff

          # The default Actions token cannot update workflow files. Restore the
          # temporary workflow tree here; the coordinating GitHub app removes it
          # immediately after the source commit lands.
          git checkout HEAD -- .github/workflows/apply-full-implementation.yml .github/workflows/export-source.yml
          git rm -r .ci/full-implementation

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Loom reference engines and shared runtime"
          git push origin "HEAD:${{ github.head_ref }}"
