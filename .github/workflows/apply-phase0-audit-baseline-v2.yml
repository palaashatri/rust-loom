name: Apply Phase 0 audit and native baseline fixes v2

on:
  push:
    branches: [chatgpt/loom-ui-functional-audit-2]
    paths: [.github/workflows/apply-phase0-audit-baseline-v2.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: loom-phase0-audit-baseline-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUST_MIN_STACK: 33554432
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply deterministic Phase 0 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_once(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: replacement target drifted')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'loom-sheets/crates/loom-sheets-app/src/main.rs',
              'record_keyboard_palette_journey(&app, "sheets", Path::new(out_dir), "format")',
              'record_keyboard_palette_journey(&app, "sheets", Path::new(out_dir), "save")',
          )
          replace_once(
              'loom-core/crates/loom-test-support/src/journey.rs',
              '    if move_step.selected <= last_query.selected {\n        passed = false;\n        failures.push("down-arrow did not move the selection forward".to_string());\n    }',
              '    if last_query.commands > 1 && move_step.selected <= last_query.selected {\n        passed = false;\n        failures.push("down-arrow did not move the selection forward".to_string());\n    }',
          )
          replace_once(
              'loom-bootstrap/scripts/audit-product-readiness.py',
              '    source_ratio = min(1.0, key_handlers / 10.0)\n    # Current journeys programmatically open the palette because modifier-key\n    # injection is unavailable and do not assert the invoked command\'s domain\n    # side effect. Keep this dimension capped until both are evidenced.\n    keyboard_score = min(0.8, source_ratio * 0.5 + journey_ratio * 0.3)',
              '    # Source handler counts are diagnostic only and contribute no readiness points.\n    # Modifier-key opening and command domain side effects remain unproven.\n    keyboard_score = min(0.3, journey_ratio * 0.3)',
          )
          replace_once(
              'loom-bootstrap/scripts/audit-product-readiness.py',
              '        f"{key_handlers} shared keyboard handlers; post-open palette journeys {journeys_passed}/8",',
              '        f"post-open palette journeys {journeys_passed}/8; {key_handlers} source handlers diagnostic only (unscored)",',
          )

          cross = root / '.github/workflows/cross-platform.yml'
          text = cross.read_text(encoding='utf-8')
          old = '      - name: Record real command-palette keyboard journeys'
          new = '      - name: Record palette input journeys (modifier-open unproven)'
          if text.count(old) != 1:
              raise SystemExit('cross-platform keyboard step drifted')
          text = text.replace(old, new, 1)
          needs_expr = '$' + '{{ needs.native-build.result }}'
          aggregate = f'''\n\n  native-baseline:\n    name: required-native-baseline\n    if: always()\n    needs: native-build\n    runs-on: ubuntu-24.04\n    steps:\n      - name: Require every declared native target to pass\n        env:\n          NATIVE_MATRIX_RESULT: {needs_expr}\n        shell: bash\n        run: |\n          set -euo pipefail\n          test "$NATIVE_MATRIX_RESULT" = "success"\n'''
          if 'name: required-native-baseline' in text:
              raise SystemExit('native baseline aggregate already exists')
          cross.write_text(text.rstrip() + aggregate, encoding='utf-8')

          truth = root / 'TRUTH.md'
          text = truth.read_text(encoding='utf-8')
          text = text.replace(
              'Epic 1 is\nnot complete; six applications still use development-era path workflows.',
              'Epic 1 is\nnot complete; Video, Studio, and Encode still require the shared native desktop workflow migration.',
          )
          text = text.replace(
              '- Writer and Sheets use that shared contract for normal Open, Save/Save As, and\n  export destination workflows.',
              '- Writer, Sheets, Present, Photo, and Motion use that shared contract for normal\n  native Open, Save/Save As, import/export destination workflows where applicable.',
          )
          bullets = {
              'Present': '- **Present:** deck/slide models, layouts, notes, transitions, scene generation,\n  validation, persistence, history, PDF output, and native New/Open/Save/Save As/\n  export-destination workflows are wired. The Phase 0 re-audit does **not** promote\n  its score: semantic round-trip assertions remain narrow, writes are non-atomic,\n  PDF output is not independently validated in the desktop journey, and recent\n  documents/import, full direct manipulation, masters, mixed media, animation\n  authoring, presenter workflows, recording, video export, and PPTX/ODP fidelity\n  remain incomplete.',
              'Photo': '- **Photo:** raster decode, pixel buffers, layers, blend modes, adjustment and\n  mask foundations, compositing, crop/resize, persistence, history, native project\n  Open/Save/Save As, raster import, and native PNG/JPEG destination workflows are\n  wired. The Phase 0 re-audit does **not** promote its score: persistence/export\n  writes are non-atomic, exported files are not independently decoded in the desktop\n  journey, recent documents are absent, and tool selection still includes status-only\n  modes rather than complete canvas interaction. Painting, production masks/selections,\n  RAW/ICC, healing, warping, HDR/panorama, PSD fidelity, GPU effects, and production\n  AI editing remain incomplete.',
              'Motion': '- **Motion:** layer/keyframe models, interpolation, transform manipulation, ordering,\n  validation, persistence, bounded history, frame sampling, SVG frame export, and\n  native New/Open/Save/Save As/export destination workflows are wired. The repaired\n  native slice has a genuinely blank New composition, exact model round-trip equality,\n  repeated-open idempotence, Save→Save As path coverage, cancellation/error coverage,\n  read-only and non-UTF-8 path coverage where supported, and responsive startup smoke\n  checks. This still does **not** justify a score increase: writes remain non-atomic,\n  recent documents and professional render validation are absent, and production\n  compositing/playback, cameras/lights, particles, effects, tracking, stabilization,\n  optical flow, and render-queue breadth remain incomplete.',
          }
          for name, replacement in bullets.items():
              next_name = {'Present':'Photo','Photo':'Motion','Motion':'Video'}[name]
              pattern = rf'- \*\*{name}:\*\*.*?(?=\n- \*\*{next_name}:\*\*)'
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'TRUTH {name} bullet drifted')
          section = '''### Present, Photo, and Motion re-audit\n\nThe Phase 0 re-audit confirms real native desktop file workflows in all three\napplications, but none earns a readiness promotion from that fact alone. Present\nstill lacks complete semantic round-trip and independent PDF evidence. Photo still\nhas non-atomic persistence/export and status-only tool modes. Motion's repaired\nnative workflow passed its focused strict gate, while its professional playback,\ncompositing, and rendering engine remains incomplete. The complete-suite truth\nscore therefore remains approximately **24/100**.\n\n'''
          marker = '### Keyboard journeys\n'
          if section not in text:
              if text.count(marker) != 1:
                  raise SystemExit('TRUTH keyboard marker drifted')
              text = text.replace(marker, section + marker, 1)
          truth.write_text(text, encoding='utf-8')

          contracts = root / 'loom-bootstrap/scripts/audit-contracts.py'
          text = contracts.read_text(encoding='utf-8')
          old = 'journey_step = cross_platform.find("Record real command-palette keyboard journeys")'
          new = 'journey_step = cross_platform.find("Record palette input journeys (modifier-open unproven)")'
          if text.count(old) != 1:
              raise SystemExit('audit-contracts keyboard marker drifted')
          text = text.replace(old, new, 1)
          insertion = r'''
# Phase 0 truth enforcement.
allowed_root_markdown = {"AGENTS.MD", "README.md", "TRUTH.md"}
for path in ROOT.iterdir():
    if path.is_file() and path.suffix.lower() == ".md" and path.name not in allowed_root_markdown:
        errors.append(f"unauthorized root Markdown file: {path.name}")

truth = (ROOT / "TRUTH.md").read_text(encoding="utf-8")
score_claims = re.findall(r"approximately\s+\*\*(\d{1,3})/100\*\*", truth)
if not score_claims:
    errors.append("TRUTH.md must contain an explicit approximate complete-suite score")
elif len(set(score_claims)) != 1:
    errors.append(f"TRUTH.md contains contradictory complete-suite scores: {sorted(set(score_claims))}")

for token in re.findall(r"`([^`\n]+)`", truth):
    if token.startswith("loom-") and "/" in token and not any(ch in token for ch in "*?{}"):
        if not (ROOT / token).exists():
            errors.append(f"TRUTH.md references missing evidence path: {token}")

if "source_ratio *" in readiness or "key_handlers / 10.0" in readiness:
    errors.append("readiness scoring must not award points from source keyboard-handler counts")
journey_source = (ROOT / "loom-core/crates/loom-test-support/src/journey.rs").read_text(encoding="utf-8")
if "open step uses the Ctrl+K host hook" not in journey_source:
    errors.append("palette journeys must disclose modifier-key opening as a host hook")
if "do not prove complete keyboard-only application operation" not in truth:
    errors.append("TRUTH.md must preserve the keyboard host-hook limitation")
if "exercise content-based format detection" not in truth or "They are not round-trip fidelity" not in truth:
    errors.append("detection-only fixtures must not be represented as conformance evidence")
if "name: required-native-baseline" not in cross_platform or "needs: native-build" not in cross_platform:
    errors.append("native package workflow must aggregate all required platform results")
'''
          marker = '\nif errors:\n'
          if text.count(marker) != 1:
              raise SystemExit('audit-contracts final marker drifted')
          text = text.replace(marker, '\n' + insertion + marker, 1)
          contracts.write_text(text, encoding='utf-8')
          PY
      - name: Audit truth and contracts
        run: |
          python3 loom-bootstrap/scripts/audit-contracts.py
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py --json /tmp/loom-readiness.json
      - name: Format all workspaces
        run: bash loom-bootstrap/scripts/fmt-all.sh
      - name: Strict Clippy across all workspaces
        run: bash loom-bootstrap/scripts/clippy-all.sh
      - name: Test all workspaces
        run: bash loom-bootstrap/scripts/test-all.sh
      - name: Release-build all workspaces
        run: bash loom-bootstrap/scripts/build-all.sh --release
      - name: Prove repaired Sheets palette journey
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          loom-sheets/target/release/loom-sheets --journey "$out" --theme dark --size 1280x800
          python3 - "$out/sheets.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          assert report['passed'] is True, report
          assert report['query'] == 'save', report
          PY
      - name: Commit validated Phase 0 tranche
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-phase0-audit-baseline.yml
          rm -f .github/workflows/apply-phase0-audit-baseline-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(audit): restore truthful Phase 0 native baseline"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
      - name: Dispatch four-platform native matrix on validated head
        run: gh workflow run cross-platform.yml --ref chatgpt/loom-ui-functional-audit-2
