name: Apply Phase 0 audit and native baseline fixes

on:
  push:
    branches: [chatgpt/loom-ui-functional-audit-2]
    paths: [.github/workflows/apply-phase0-audit-baseline.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: loom-phase0-audit-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUST_MIN_STACK: 33554432
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/loom-ui-functional-audit-2
          fetch-depth: 1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Apply deterministic Phase 0 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = root / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Sheets removed its old formatting commands, but the native journey still
          # searched for them. Use the real Save/Save As family, which exists and
          # narrows the palette without inventing commands.
          replace_once(
              'loom-sheets/crates/loom-sheets-app/src/main.rs',
              'record_keyboard_palette_journey(&app, "sheets", Path::new(out_dir), "format")',
              'record_keyboard_palette_journey(&app, "sheets", Path::new(out_dir), "save")',
          )

          # A single-result filter is valid. The canonical journey may press Down,
          # but movement is only an invariant when the filtered list has >1 item.
          replace_once(
              'loom-core/crates/loom-test-support/src/journey.rs',
              '    if move_step.selected <= last_query.selected {\n        passed = false;\n        failures.push("down-arrow did not move the selection forward".to_string());\n    }',
              '    if last_query.commands > 1 && move_step.selected <= last_query.selected {\n        passed = false;\n        failures.push("down-arrow did not move the selection forward".to_string());\n    }',
          )

          # Source handler counts are diagnostics, not readiness evidence.
          replace_once(
              'loom-bootstrap/scripts/audit-product-readiness.py',
              '    source_ratio = min(1.0, key_handlers / 10.0)\n    # Current journeys programmatically open the palette because modifier-key\n    # injection is unavailable and do not assert the invoked command\'s domain\n    # side effect. Keep this dimension capped until both are evidenced.\n    keyboard_score = min(0.8, source_ratio * 0.5 + journey_ratio * 0.3)',
              '    # Source handler counts are reported diagnostically but contribute no\n    # readiness points. Current journeys programmatically open the palette because\n    # modifier-key injection is unavailable and do not assert the invoked command\'s\n    # domain side effect. Only demonstrated post-open input behavior is scored.\n    keyboard_score = min(0.3, journey_ratio * 0.3)',
          )
          replace_once(
              'loom-bootstrap/scripts/audit-product-readiness.py',
              '        f"{key_handlers} shared keyboard handlers; post-open palette journeys {journeys_passed}/8",',
              '        f"post-open palette journeys {journeys_passed}/8; {key_handlers} source handlers reported diagnostically (unscored)",',
          )

          cross = root / '.github/workflows/cross-platform.yml'
          cross_text = cross.read_text(encoding='utf-8')
          old_step = '      - name: Record real command-palette keyboard journeys'
          new_step = '      - name: Record palette input journeys (modifier-open unproven)'
          if cross_text.count(old_step) != 1:
              raise SystemExit('cross-platform.yml: keyboard journey step target drifted')
          cross_text = cross_text.replace(old_step, new_step, 1)
          aggregate = '''\n\n  native-baseline:\n    name: required-native-baseline\n    if: always()\n    needs: native-build\n    runs-on: ubuntu-24.04\n    steps:\n      - name: Require every declared native target to pass\n        env:\n          NATIVE_MATRIX_RESULT: ${{ needs.native-build.result }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          if [ "$NATIVE_MATRIX_RESULT" != "success" ]; then\n            echo "required native matrix did not fully pass: $NATIVE_MATRIX_RESULT" >&2\n            exit 1\n          fi\n'''
          if 'name: required-native-baseline' in cross_text:
              raise SystemExit('cross-platform.yml: native aggregate already exists')
          cross.write_text(cross_text.rstrip() + aggregate, encoding='utf-8')

          truth = root / 'TRUTH.md'
          truth_text = truth.read_text(encoding='utf-8')
          truth_text = truth_text.replace(
              'Epic 1 is\nnot complete; six applications still use development-era path workflows.',
              'Epic 1 is\nnot complete; Video, Studio, and Encode still require the shared native desktop workflow migration.',
          )
          truth_text = truth_text.replace(
              '- Writer and Sheets use that shared contract for normal Open, Save/Save As, and\n  export destination workflows.',
              '- Writer, Sheets, Present, Photo, and Motion use that shared contract for normal\n  native Open, Save/Save As, import/export destination workflows where applicable.',
          )

          replacements = {
              'Present': '''- **Present:** deck/slide models, layouts, notes, transitions, scene generation,\n  validation, persistence, history, PDF output, and native New/Open/Save/Save As/\n  export-destination workflows are wired. The Phase 0 re-audit does **not** promote\n  its score: save/load coverage still checks only a narrow subset of semantic state,\n  writes are direct rather than atomic/background transactions, PDF output is not\n  independently validated in the desktop journey, and recent documents/import, full\n  direct manipulation, masters, mixed media, animation authoring, presenter workflows,\n  recording, video export, and PPTX/ODP fidelity remain incomplete.''',
              'Photo': '''- **Photo:** raster decode, pixel buffers, layers, blend modes, adjustment and\n  mask foundations, compositing, crop/resize, persistence, history, native project\n  Open/Save/Save As, raster import, and native PNG/JPEG destination workflows are\n  wired. The Phase 0 re-audit does **not** promote its score: project/export writes\n  are non-atomic, exported files are not independently decoded in the desktop journey,\n  recent documents are absent, and tool selection currently includes status-only tool\n  modes rather than complete canvas interaction. Painting, production masks/selections,\n  RAW/ICC, healing, warping, HDR/panorama, PSD fidelity, GPU effects, and production AI\n  editing remain incomplete.''',
              'Motion': '''- **Motion:** layer/keyframe models, interpolation, transform manipulation, ordering,\n  validation, persistence, bounded history, frame sampling, SVG frame export, and native\n  New/Open/Save/Save As/export destination workflows are wired. The repaired native\n  slice now has a genuinely blank New composition, exact model round-trip equality,\n  repeated-open idempotence, Save→Save As path coverage, cancellation/error coverage,\n  read-only and non-UTF-8 path coverage where supported, and representative responsive\n  startup smoke checks. This still does **not** justify a score increase: writes remain\n  non-atomic, recent documents and professional render validation are absent, and a\n  production compositor, synchronized playback, cameras/lights, particles, effects,\n  tracking, stabilization, optical flow, and render-queue breadth remain incomplete.''',
          }
          for name, replacement in replacements.items():
              next_name = {'Present': 'Photo', 'Photo': 'Motion', 'Motion': 'Video'}[name]
              pattern = rf'- \*\*{name}:\*\*.*?(?=\n- \*\*{next_name}:\*\*)'
              truth_text, count = re.subn(pattern, replacement, truth_text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'TRUTH.md: failed to replace {name} boundary')

          audit_section = '''### Present, Photo, and Motion re-audit\n\nThe Phase 0 re-audit confirms that all three applications now have real native\ndesktop file workflows, but none earns a readiness promotion from that fact alone.\nPresent still lacks complete semantic round-trip assertions and independent PDF\nvalidation. Photo still has non-atomic persistence/export and status-only tool modes.\nMotion's repaired native workflow tranche passed its focused strict gate, but the\nprofessional playback/compositing/rendering engine remains far outside the frozen\ncontract. The complete-suite truth score therefore remains approximately **24/100**.\n\n'''
          marker = '### Keyboard journeys\n'
          if audit_section not in truth_text:
              if truth_text.count(marker) != 1:
                  raise SystemExit('TRUTH.md: keyboard evidence marker drifted')
              truth_text = truth_text.replace(marker, audit_section + marker, 1)
          truth.write_text(truth_text, encoding='utf-8')

          contracts = root / 'loom-bootstrap/scripts/audit-contracts.py'
          contracts_text = contracts.read_text(encoding='utf-8')
          contracts_text = contracts_text.replace(
              'journey_step = cross_platform.find("Record real command-palette keyboard journeys")',
              'journey_step = cross_platform.find("Record palette input journeys (modifier-open unproven)")',
          )
          insertion = r'''
# Root Markdown is a strict allowlist, not a growing blacklist.
allowed_root_markdown = {"AGENTS.MD", "README.md", "TRUTH.md"}
for path in ROOT.iterdir():
    if path.is_file() and path.suffix.lower() == ".md" and path.name not in allowed_root_markdown:
        errors.append(f"unauthorized root Markdown file: {path.name}")

truth = (ROOT / "TRUTH.md").read_text(encoding="utf-8")
score_claims = re.findall(r"approximately\s+\*\*(\d{1,3})/100\*\*", truth)
if not score_claims:
    errors.append("TRUTH.md must contain an explicit approximate complete-suite score")
elif len(set(score_claims)) != 1:
    errors.append(f"TRUTH.md contains contradictory complete-suite scores: {sorted(set(score_claims))}")

for token in re.findall(r"`([^`\n]+)`", truth):
    if token.startswith("loom-") and "/" in token and not any(ch in token for ch in "*?{}"):
        candidate = ROOT / token
        if not candidate.exists():
            errors.append(f"TRUTH.md references missing evidence path: {token}")

if "source_ratio *" in readiness or "key_handlers / 10.0" in readiness:
    errors.append("readiness scoring must not award points from source keyboard-handler counts")

journey_source = (ROOT / "loom-core/crates/loom-test-support/src/journey.rs").read_text(encoding="utf-8")
if "open step uses the Ctrl+K host hook" not in journey_source:
    errors.append("palette journeys must disclose that modifier-key opening is not real injected input")
if "do not prove complete keyboard-only application operation" not in truth:
    errors.append("TRUTH.md must keep the host-hook keyboard evidence limitation explicit")
if "exercise content-based format detection" not in truth or "They are not round-trip fidelity" not in truth:
    errors.append("TRUTH.md must classify detection-only fixtures as non-conformance evidence")
if "name: required-native-baseline" not in cross_platform or "needs: native-build" not in cross_platform:
    errors.append("native package workflow must aggregate every required platform result")
'''
          marker = '\nif errors:\n'
          if insertion.strip() not in contracts_text:
              if contracts_text.count(marker) != 1:
                  raise SystemExit('audit-contracts.py: final error marker drifted')
              contracts_text = contracts_text.replace(marker, '\n' + insertion + marker, 1)
          contracts.write_text(contracts_text, encoding='utf-8')
          PY
      - name: Audit truth and contracts
        run: |
          python3 loom-bootstrap/scripts/audit-contracts.py
          python3 loom-bootstrap/scripts/audit-product-ui.py
          python3 loom-bootstrap/scripts/audit-product-readiness.py --json /tmp/loom-readiness.json
      - name: Format all workspaces
        run: bash loom-bootstrap/scripts/fmt-all.sh
      - name: Strict Clippy across all workspaces
        run: bash loom-bootstrap/scripts/clippy-all.sh
      - name: Test all workspaces
        run: bash loom-bootstrap/scripts/test-all.sh
      - name: Release-build all workspaces
        run: bash loom-bootstrap/scripts/build-all.sh --release
      - name: Prove repaired Sheets palette journey
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          loom-sheets/target/release/loom-sheets --journey "$out" --theme dark --size 1280x800
          python3 - "$out/sheets.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          assert report['passed'] is True, report
          assert report['query'] == 'save', report
          query_steps = [s for s in report['steps'] if s['name'].startswith('2-query-')]
          assert query_steps and query_steps[-1]['commands'] >= 1, report
          PY
      - name: Commit validated Phase 0 tranche
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-phase0-audit-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(audit): restore truthful Phase 0 native baseline"
          git push origin HEAD:chatgpt/loom-ui-functional-audit-2
      - name: Dispatch four-platform native matrix on validated head
        shell: bash
        run: gh workflow run cross-platform.yml --ref chatgpt/loom-ui-functional-audit-2
