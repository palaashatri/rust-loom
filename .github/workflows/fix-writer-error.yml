name: Fix Writer package error

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'chatgpt/loom-ui-functional-audit-2' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Preserve ManifestError conversion
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('loom-writer/crates/loom-writer-core/src/lib.rs')
          text = path.read_text()
          pattern = re.compile(
              r'MimeType::parse\("application/vnd\.loom\.document-content"\)\s*'
              r'\.map_err\(\|e\| format!\("invalid built-in writer MIME type: \{e\}"\)\)\?'
          )
          text, count = pattern.subn(
              'MimeType::parse("application/vnd.loom.document-content")?',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one Writer MIME conversion, changed {count}')
          path.write_text(text)
          PY
          cargo fmt --manifest-path loom-writer/Cargo.toml --all
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loom-writer
          git commit -m "fix(writer): preserve package manifest error type"
          git push origin "HEAD:${{ github.head_ref }}"
