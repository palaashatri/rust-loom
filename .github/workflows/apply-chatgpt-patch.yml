name: Apply Loom audit patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'chatgpt/loom-ui-functional-audit-2' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed source patch
        run: |
          gzip -d < .ci/loom-ui-functional.patch.gz.b64 > /tmp/loom-ui-functional.patch
          git apply --check --binary /tmp/loom-ui-functional.patch
          git apply --binary /tmp/loom-ui-functional.patch

          # GitHub Actions tokens cannot create/update workflow files. Keep the
          # current workflow tree untouched in this bot-authored commit; the
          # coordinating GitHub app will install the final root workflow next.
          git checkout HEAD -- .github/workflows/apply-chatgpt-patch.yml loom-bootstrap/.github/workflows/ci.yml
          rm -f .github/workflows/ci.yml
          git rm .ci/loom-ui-functional.patch.gz.b64

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: audit Loom UI contracts and honest app capabilities"
          git push origin "HEAD:${{ github.head_ref }}"
