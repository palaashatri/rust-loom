name: Apply Loom audit patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'chatgpt/loom-ui-functional-audit-2' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed source patch
        run: |
          gzip -d < .ci/loom-ui-functional.patch.gz.b64 > /tmp/loom-ui-functional.patch
          git apply --check --binary /tmp/loom-ui-functional.patch
          git apply --binary /tmp/loom-ui-functional.patch
          git rm .ci/loom-ui-functional.patch.gz.b64 .github/workflows/apply-chatgpt-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: audit Loom UI contracts and honest app capabilities"
          git push origin "HEAD:${{ github.head_ref }}"
