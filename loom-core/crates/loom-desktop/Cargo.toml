[package]
name = "loom-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native desktop service contracts and adapters for Loom applications"

[dependencies]
rfd = "0.17.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSColor", "NSMenu", "NSResponder", "NSView", "NSWindow"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6.2"
