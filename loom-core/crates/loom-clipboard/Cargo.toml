[package]
name = "loom-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Multi-format clipboard architecture for Loom Office suite"

[dependencies]
loom-objects = { path = "../loom-objects" }
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
# X11 and Wayland owner-served clipboard with an HTML flavour next to plain text.
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"

[dev-dependencies]
