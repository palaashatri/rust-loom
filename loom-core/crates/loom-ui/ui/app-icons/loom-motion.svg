  <linearGradient id="film" x1="0" y1="0" x2=".95" y2="1"><stop offset="0" stop-color="#3B9FAE"/><stop offset=".5" stop-color="#317FA5"/><stop offset="1" stop-color="#15AEB3"/></linearGradient>
  <linearGradient id="specular" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".31"/><stop offset=".35" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
