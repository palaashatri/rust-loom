[package]
name = "loom-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared Slint component library and design tokens for Loom."

[dependencies]
slint = { version = "1.17.1", default-features = false, features = ["std", "compat-1-2"] }

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
image = "0.25"
loom-test-support = { path = "../loom-test-support" }

[features]
# Enable this feature to also bring the windowing backends used by the
# real desktop apps (winit + femtovg + software renderer). The library
# itself is backend-agnostic.
default = ["backend-winit", "renderer-femtovg", "renderer-software"]
backend-winit = ["slint/backend-winit"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-software = ["slint/renderer-software"]
