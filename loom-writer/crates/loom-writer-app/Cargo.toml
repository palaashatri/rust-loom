[package]
name = "loom-writer-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Loom Writer desktop application"

[[bin]]
name = "loom-writer"
path = "src/main.rs"

[dependencies]
loom-writer-core = { path = "../loom-writer-core" }
loom-fonts = { workspace = true }
loom-command = { path = "../../../loom-core/crates/loom-command" }
loom-desktop = { path = "../../../loom-core/crates/loom-desktop" }
loom-production = { path = "../../../loom-core/crates/loom-production" }
loom-storage = { path = "../../../loom-core/crates/loom-storage" }
loom-text = { path = "../../../loom-core/crates/loom-text" }
loom-ui = { path = "../../../loom-core/crates/loom-ui" }
loom-test-support = { path = "../../../loom-core/crates/loom-test-support" }
loom-objects = { path = "../../../loom-core/crates/loom-objects" }
loom-clipboard = { path = "../../../loom-core/crates/loom-clipboard" }
loom-package = { path = "../../../loom-core/crates/loom-package" }
slint = "1.17.1"
i-slint-backend-winit = { version = "=1.17.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6.2"

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
i-slint-backend-testing = "1.17.1"
# Pictures for the Insert Picture tests.
image = { version = "0.25", default-features = false, features = ["png"] }
loom-pdf = { path = "../../../loom-core/crates/loom-pdf", features = ["test-support"] }
# The fixture fonts the picker and highlight tests install.
loom-writer-core = { path = "../loom-writer-core", features = ["test-support"] }
# A test registers a fixture face with the window's font collection, so the
# page can draw a family the machine does not have installed.
slint = { version = "1.17.1", features = ["unstable-fontique-010"] }
