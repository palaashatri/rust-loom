[workspace]
resolver = "2"
members = [
    "crates/loom-writer-core",
    "crates/loom-writer-cli",
    "crates/loom-writer-app",
]

# Writer's keystroke/pagination gates are measured through the test profile;
# unoptimized builds are not representative of the shipped application.
[profile.dev]
opt-level = 2

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
loom-document = { path = "../loom-core/crates/loom-document" }
loom-package = { path = "../loom-core/crates/loom-package" }
loom-text = { path = "../loom-core/crates/loom-text" }
loom-command = { path = "../loom-core/crates/loom-command" }
loom-pdf = { path = "../loom-core/crates/loom-pdf" }
loom-fonts = { path = "../loom-core/crates/loom-fonts", default-features = false, features = ["bundled-inter-text", "bundled-script-fallback", "glyph-raster"] }
loom-objects = { path = "../loom-core/crates/loom-objects" }
loom-ui = { path = "../loom-core/crates/loom-ui" }
loom-test-support = { path = "../loom-core/crates/loom-test-support" }
