[package]
name = "loom-sheets-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Loom Sheets desktop application"

[[bin]]
name = "loom-sheets"
path = "src/main.rs"

[dependencies]
loom-sheets-core = { path = "../loom-sheets-core" }
loom-desktop = { path = "../../../loom-core/crates/loom-desktop" }
loom-production = { path = "../../../loom-core/crates/loom-production" }
loom-package = { workspace = true }
loom-storage = { path = "../../../loom-core/crates/loom-storage" }
loom-ui = { path = "../../../loom-core/crates/loom-ui" }
loom-test-support = { path = "../../../loom-core/crates/loom-test-support" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.17.1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
i-slint-backend-testing = "1.17.1"
i-slint-common = { version = "=1.17.1", default-features = false, features = ["fontconfig-dlopen"] }
