schema_version = 1

[limits]
rust_max_bytes = 65536
slint_max_bytes = 32768
python_max_bytes = 32768
shell_max_bytes = 16384
recommended_rust_lines = 800
recommended_slint_lines = 500
recommended_script_lines = 600
recommended_function_lines = 80

[policy]
legacy_files_may_not_grow = true
new_dead_code_allows_forbidden = true
broad_lint_suppression_forbidden = true
new_generic_ui_must_live_in_foundation = true

# Exact byte ceilings for legacy oversized source. These are debt ceilings,
# not acceptable target sizes. Any meaningful edit should reduce them.
[legacy_byte_caps]
"loom-writer/crates/loom-writer-app/src/main.rs" = 184397
"loom-sheets/crates/loom-sheets-app/src/main.rs" = 85226
"loom-present/crates/loom-present-app/src/main.rs" = 119022
"loom-writer/crates/loom-writer-core/src/lib.rs" = 233716
"loom-sheets/crates/loom-sheets-core/src/lib.rs" = 146343
"loom-present/crates/loom-present-core/src/lib.rs" = 143222
"loom-core/crates/loom-ui/ui/toolkit.slint" = 50808
"loom-writer/crates/loom-writer-app/ui/app.slint" = 36500
"loom-sheets/crates/loom-sheets-app/ui/app.slint" = 39694
"loom-sheets/crates/loom-sheets-app/ui/components.slint" = 35953
"loom-present/crates/loom-present-app/ui/app.slint" = 39826
