schema_version = 1

[limits]
rust_max_bytes = 65536
slint_max_bytes = 32768
python_max_bytes = 32768
shell_max_bytes = 16384
recommended_rust_lines = 800
recommended_slint_lines = 500
recommended_script_lines = 600
recommended_function_lines = 80

[policy]
legacy_files_may_not_grow = true
new_dead_code_allows_forbidden = true
broad_lint_suppression_forbidden = true
new_generic_ui_must_live_in_foundation = true

# Exact byte ceilings for legacy oversized source. These are debt ceilings,
# not acceptable target sizes. Any meaningful edit should reduce them.
