schema_version = 1

[policy]
commercial_redistribution_required = true
unknown_license_forbidden = true
noncommercial_forbidden = true
personal_use_forbidden = true
editorial_only_forbidden = true
scraped_proprietary_assets_forbidden = true
prefer_original_or_generated = true

# Original suite artwork and mechanical platform encodings share one provenance record.
[[allow]]
glob = "loom-core/crates/loom-ui/ui/app-icons/*"
origin = "Original Loom application artwork generated with image_gen on 2026-10-27; prompts and encoding record in app-icons/provenance.json and encoding-manifest.json"
license = "MIT OR Apache-2.0 (repository project license)"
commercial = true
redistributable = true
attribution_required = false

# Project-generated screenshots are evidence, not shipped third-party artwork.
[[allow]]
glob = "loom-*/docs/screenshot.png"
origin = "Loom project-generated screenshot"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

[[allow]]
glob = "loom-*/docs/screenshot-deterministic.png"
origin = "Loom project-generated deterministic screenshot"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

[[allow]]
glob = "loom-*/docs/screenshot-linux*.png"
origin = "Loom project-generated native Linux QA screenshot"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

[[allow]]
glob = "loom-*/docs/acceptance/*.png"
origin = "Loom project-generated acceptance test screenshot"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

[[allow]]
glob = "loom-*/docs/qa-native/*.png"
origin = "Loom project-generated native QA screenshot"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

[[allow]]
glob = "docs/qa/*.png"
origin = "Loom project-generated QA screenshot"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

[[allow]]
glob = "docs/qa-live-windows/*.png"
origin = "Loom project-generated live-window QA screenshot"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

# Sheets renderer captures are project-created QA evidence, not shipped artwork.
[[allow]]
glob = "loom-sheets/docs/qa-renderer/*.png"
origin = "Loom Sheets project-generated renderer QA screenshot"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

[[allow]]
glob = "loom-core/crates/loom-ui/baselines/foundation/*.png"
origin = "Loom foundation accepted baseline capture"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

# Sheets import fixtures: small workbooks authored with Microsoft Excel
# automation (loom-sheets-core/tests/excel/author_import_fixtures.ps1). They
# contain only synthetic cells, a generated chart, a 1x1 pixel PNG and a plain
# rectangle written for the test; no third-party content.
[[allow]]
glob = "loom-sheets/crates/loom-sheets-core/tests/fixtures/*.xlsx"
origin = "Loom-generated test fixture authored with Microsoft Excel automation"
license = "Repository project license"
commercial = true
redistributable = true
attribution_required = false

[allowed_external_license_families]
values = [
  "CC0-1.0",
  "Public-Domain",
  "OFL-1.1",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
]

# Bundled UI typeface. Inter is the closest open-licensed face to the system UI
# fonts of the platforms Loom competes with; shipping it makes text metrics
# identical on Windows, Linux, and macOS.
[[allow]]
glob = "loom-core/crates/loom-ui/ui/fonts/Inter-*.ttf"
origin = "Inter 4.0 (https://github.com/rsms/inter/releases/tag/v4.0), static TTF instances"
license = "SIL Open Font License 1.1 (loom-core/crates/loom-ui/ui/fonts/Inter-LICENSE.txt)"
commercial = true
redistributable = true
attribution_required = true

[[allow]]
glob = "loom-core/crates/loom-ui/ui/fonts/Inter-LICENSE.txt"
origin = "Inter 4.0 license text"
license = "SIL Open Font License 1.1"
commercial = true
redistributable = true
attribution_required = true

# Optional deterministic Writer fallbacks, copied byte-for-byte from the
# pinned Noto revision. Both font folders use that revision's root LICENSE.
[[allow]]
glob = "loom-core/crates/loom-fonts/assets/fonts/NotoNaskhArabic-Regular.ttf"
origin = "notofonts/noto-fonts@ffebf8c1ee449e544955a7e813c54f9b73848eac:hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf (SHA-256 2F4B88E6EE50FA82C617E2D1D4BA18281CB1C6CD71C3AF3EC64970C23995DB4B)"
license = "SIL Open Font License 1.1 (loom-core/crates/loom-fonts/assets/fonts/Noto-OFL.txt; pinned repository root LICENSE)"
commercial = true
redistributable = true
attribution_required = true

[[allow]]
glob = "loom-core/crates/loom-fonts/assets/fonts/NotoSansHebrew-Regular.ttf"
origin = "notofonts/noto-fonts@ffebf8c1ee449e544955a7e813c54f9b73848eac:hinted/ttf/NotoSansHebrew/NotoSansHebrew-Regular.ttf (SHA-256 A7FA16FFFB27BEDB060A0866267C29E9859AEB9C21CC33F5B3AAF6EB062ECA85)"
license = "SIL Open Font License 1.1 (loom-core/crates/loom-fonts/assets/fonts/Noto-OFL.txt; pinned repository root LICENSE)"
commercial = true
redistributable = true
attribution_required = true

[[allow]]
glob = "loom-core/crates/loom-fonts/assets/fonts/Noto-OFL.txt"
origin = "notofonts/noto-fonts@ffebf8c1ee449e544955a7e813c54f9b73848eac root LICENSE"
license = "SIL Open Font License 1.1"
commercial = true
redistributable = true
attribution_required = true

