schema_version = 1
phase = "audit-repair"
foundation_status = "ACCEPTED"
application_development_locked = true
consumer_imports_allowed = false
active_repair = "shared-recovery"
next_application = "sheets"
# Keep already-migrated UI compiling; this is not permission for new adoption.
existing_foundation_consumers = ["sheets", "writer", "present", "photo", "motion"]

application_order = [
  "sheets",
  "writer",
  "present",
  "photo",
  "motion",
  "video",
  "studio",
  "encode",
]

# Outer file boundary only. The named active_repair still limits product edits.
# UI/desktop/design entries do not authorize unrelated work during shared recovery.
allowed_active_prefixes = [
  ".github/",
  "AGENTS.MD",
  "TRUTH.md",
  "README.md",
  "loom-bootstrap/",
  "loom-core/crates/loom-ui/",
  "loom-core/crates/loom-desktop/",
  "loom-core/crates/loom-production/",
  "loom-core/crates/loom-storage/",
  "loom-design-bible/contracts/",
  "loom-design-bible/tokens/",
]

[foundation_gate]
mechanical_required = true
human_visual_approval_required = true
approved_baseline_required_after_acceptance = true
status = "ACCEPTED"

[foundation_gate.required_evidence]
viewports = ["1024x720", "1280x800", "1440x900", "1920x1200"]
themes = ["light", "dark", "high-contrast"]
text_scales = [1.0, 1.25, 1.5]
directions = ["ltr", "rtl"]

[application_status]
sheets = "LOCKED"
writer = "LOCKED"
present = "LOCKED"
photo = "LOCKED"
motion = "LOCKED"
video = "LOCKED"
studio = "LOCKED"
encode = "LOCKED"
