schema_version = 1
phase = "office-v1"
foundation_status = "ACCEPTED"
application_development_locked = false
consumer_imports_allowed = true
next_application = "photo"
# Keep already-migrated UI compiling; this is not permission for new adoption.
existing_foundation_consumers = ["sheets", "writer", "present", "photo", "motion"]

application_order = [
  "sheets",
  "writer",
  "present",
  "photo",
  "motion",
  "video",
  "studio",
  "encode",
]

# Outer file boundary for the 2026-10-02/10-06 owner-authorized Sheets,
# Writer, and Present production push. Product acceptance gates remain blocked.
allowed_active_prefixes = [
  ".agents/",
  ".github/",
  "AGENTS.md",
  "README.md",
  "loom-bootstrap/",
  "loom-core/",
  "loom-sheets/",
  "loom-writer/",
  "loom-present/",
  # UI-42 authorizes this exact responsive contract file only.
  "loom-design-bible/contracts/desktop-ui.toml",
]

[foundation_gate]
mechanical_required = true
human_visual_approval_required = true
approved_baseline_required_after_acceptance = true
status = "ACCEPTED"

[foundation_gate.required_evidence]
viewports = ["1024x720", "1280x800", "1440x900", "1920x1200"]
themes = ["light", "dark", "high-contrast"]
text_scales = [1.0, 1.25, 1.5]
directions = ["ltr", "rtl"]

[application_status]
sheets = "IN_PROGRESS"
writer = "IN_PROGRESS"
present = "IN_PROGRESS"
photo = "LOCKED"
motion = "LOCKED"
video = "LOCKED"
studio = "LOCKED"
encode = "LOCKED"
