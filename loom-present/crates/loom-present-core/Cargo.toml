[package]
name = "loom-present-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
loom-document.workspace = true
loom-package.workspace = true
loom-command.workspace = true
loom-pdf.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
# `loom_pdf::inspect` reads exported PDFs back; production builds do not carry it.
loom-pdf = { workspace = true, features = ["test-support"] }
roxmltree = "0.21"
