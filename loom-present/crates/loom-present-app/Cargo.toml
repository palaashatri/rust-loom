[package]
name = "loom-present-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "loom-present"
path = "src/main.rs"

[dependencies]
loom-present-core = { path = "../loom-present-core" }
loom-desktop = { path = "../../../loom-core/crates/loom-desktop" }
loom-command.workspace = true
loom-production = { path = "../../../loom-core/crates/loom-production" }
loom-storage = { path = "../../../loom-core/crates/loom-storage" }
loom-test-support.workspace = true
loom-ui.workspace = true
slint = "1.7"
i-slint-backend-winit = { version = "=1.17.1", default-features = false }

[build-dependencies]
slint-build = "1.7"

[dev-dependencies]
loom-package.workspace = true
i-slint-backend-testing = "1.17.1"
# Raw key events, so a test can deliver Ctrl+Alt+Arrow the way winit does.
i-slint-core = { version = "=1.17.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
