# Loom Plugin SDK — workspace manifest.
# See LICENSE_POLICY.md for licensing decisions (MIT OR Apache-2.0).

[workspace]
resolver = "2"
members = [
    "crates/loom-plugin-manifest",
    "crates/loom-plugin-host",
    "crates/loom-plugin-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Loom Project"]
description = "Sandboxed extension system for the Loom creative suite."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
loom-plugin-manifest = { version = "0.1.0", path = "crates/loom-plugin-manifest" }
loom-plugin-host = { version = "0.1.0", path = "crates/loom-plugin-host" }

[profile.release]
lto = "thin"
